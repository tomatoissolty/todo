<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EXPENSE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family:'JejuStoneWall'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-EF@1.0/EF_jejudoldam.woff2') format('woff2'); font-weight:normal; font-display:swap; }
@font-face { font-family:'ImHyeMin'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2106@1.1/IM_Hyemin-Regular.woff2') format('woff2'); font-weight:normal; font-display:swap; }
@font-face { font-family:'OkDandan'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2508-2@1.0/OkDanDan-Bold.woff2') format('woff2'); font-weight:normal; font-display:swap; }
@font-face { font-family:'KkuBulLim'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/BMkkubulimTTF-Regular.woff2') format('woff2'); font-weight:normal; font-display:swap; }
:root{
  --bg:#f7f9f6; --card:#ffffff; --ink:#233026; --ink-soft:#7c8c80; --line:#e2e8de;
  --mint:#3fae7a; --mint-soft:#e3f5ec; --red:#e2635b; --red-soft:#fbe8e6;
  --sky:#8fd0e8; --sky-soft:#e5f6fb; --sky-deep:#2b90b8; --sand:#f0c48a; --sand-soft:#fdf1e0; --sand-deep:#d9822b;
  --font-body:'ImHyeMin','Noto Sans KR',sans-serif;
  --font-btn:'ImHyeMin','Noto Sans KR',sans-serif; /* 세종글꽃체 웹폰트 배포처가 없어서 임시로 이 폰트로 대체 - 파일 주시면 바로 교체할게요 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:520px;width:100%;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 130px;flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.title{font-family:'JejuStoneWall',sans-serif;font-size:26px;letter-spacing:1px;cursor:pointer}
.period-calendar{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;z-index:30;display:none;box-shadow:0 8px 20px rgba(0,0,0,.1);max-height:70vh;overflow-y:auto;box-sizing:border-box}
.period-calendar.open{display:block}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;font-size:12px}
.cal-nav .close-btn{margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:9px;color:var(--ink-soft);text-align:center;padding:2px 0}
.cal-day{padding:8px 0;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;cursor:pointer;color:var(--ink)}
.cal-day:hover{background:var(--sky-soft)}
.cal-day.empty{visibility:hidden;cursor:default}
.hdr-btns{display:flex;gap:8px}
.icon-btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:12px;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:5px;color:var(--ink)}
.save-report-btn{width:34px;height:34px;border:none;background:none;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;padding:0}
.save-report-btn svg{width:19px;height:19px}
.save-report-btn:hover{color:var(--sky-deep)}

/* ═══ 전광막(split-flap) 전광판 ═══ */
.board-tabs{display:flex;gap:4px;margin-bottom:8px}
.board-tab{flex:1;padding:3px 2px;border:1px solid var(--line);border-radius:5px;background:var(--card);font-size:8px;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body)}
.board-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.split-board{background:#181614;border-radius:8px;padding:6px 8px;display:flex;align-items:center;justify-content:flex-end;gap:1px;margin-bottom:8px;overflow:hidden}

.list-entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.list-entry:hover{border-color:var(--sky-deep)}
.le-date-badge{width:36px;height:36px;border-radius:9px;background:var(--sky-soft);color:#2b6b82;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.le-date-badge.income{background:var(--sand-soft);color:#96652b}
.le-date-badge .d{font-size:15px;font-weight:700;line-height:1}
.le-date-badge .m{font-size:8px;opacity:.8}
.le-main{flex:1;min-width:0}
.le-cat{font-size:13px;font-weight:500}
.le-meta{font-size:10px;color:var(--ink-soft);margin-top:2px}
.le-amt{text-align:right;flex-shrink:0}
.le-share{font-size:14px;font-weight:700}
.le-total{font-size:10px;color:var(--ink-soft)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:12px}
.add-btn-wrap{position:fixed;left:0;right:0;bottom:42px;display:flex;justify-content:center;z-index:10;pointer-events:none}
.add-text-btn{pointer-events:all;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:0;margin:0}
.add-label{font-family:'KkuBulLim',var(--font-btn);font-size:39px;color:var(--ink);padding:8px 16px}
.an-char{transition:opacity .2s}
.add-text-btn:hover .an-char{opacity:.12}
.arrow-slot{font-size:39px;line-height:1;color:var(--sky-deep);visibility:hidden;margin-bottom:1px}
.add-text-btn:hover .arrow-slot{visibility:visible}
.list-wrap{padding-bottom:16px;margin-top:auto}

/* ═══ 픽셀 바다 (클릭하면 추가 모달) ═══ */

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
@media(min-width:560px){.modal-overlay{align-items:center}}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px}
@media(min-width:560px){.modal{border-radius:18px}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.modal-title{font-family:'JejuStoneWall',sans-serif;font-size:19px}
.type-toggle{display:flex;gap:22px;margin-bottom:16px;align-items:baseline}
.type-btn{background:none;border:none;cursor:pointer;font-size:39px;color:var(--ink);opacity:.32;transition:opacity .2s,transform .2s;padding:0}
.type-btn:hover{opacity:.6}
.type-btn[data-t="expense"]{font-family:'KkuBulLim',var(--font-btn)}
.type-btn[data-t="income"]{font-family:'OkDandan',var(--font-btn)}
.type-btn.active{opacity:1;transform:scale(1.08)}
.type-btn.active[data-t="expense"]{color:#2b90b8}
.type-btn.active[data-t="income"]{color:#c97a2b}
.form-lbl{font-size:11px;color:var(--ink-soft);margin:12px 0 6px;display:block}
.form-input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:var(--font-body);outline:none}
.form-input:focus{border-color:var(--sky-deep)}
.form-input[type="number"]{-moz-appearance:textfield}
.form-input[type="number"]::-webkit-outer-spin-button,.form-input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.amount-row{display:flex;gap:8px;align-items:stretch}
.amount-row .form-input{width:50%;flex:none}
.amount-btns{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.amt-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11px;cursor:pointer;color:var(--ink-soft);font-family:var(--font-btn);padding:0}
.amt-btn.plus{color:var(--sky-deep)}
.amt-btn.minus{color:var(--red)}

.method-grid{display:flex;flex-wrap:wrap;gap:6px}
.method-opt{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:12px;color:var(--ink-soft);font-family:var(--font-btn)}
.method-opt.active{background:var(--sky-soft);border-color:var(--sky-deep);color:var(--sky-deep)}
.card-sub-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.card-sub-opt{padding:6px 11px;border:1px dashed var(--ink-soft);border-radius:8px;background:var(--card);cursor:pointer;font-size:11px;color:var(--ink-soft);font-family:var(--font-btn)}
.card-sub-opt.active{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;border-style:solid}

.split-mode-toggle{display:flex;gap:6px;margin-bottom:8px}
.split-mode-btn{flex:1;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:11px;color:var(--ink-soft);font-family:var(--font-btn)}
.split-mode-btn.active{background:var(--sky-soft);border-color:var(--sky-deep);color:var(--sky-deep)}
.split-row{display:flex;align-items:center;gap:10px}
.split-row input{width:70px}
.share-preview{font-size:12px;color:var(--ink-soft);background:var(--sky-soft);padding:8px 10px;border-radius:8px;margin-top:8px}
.share-preview b{color:var(--sky-deep);font-size:14px}
#inDirectShare{background:transparent;border:none;font-weight:700;color:var(--sky-deep);width:80px;padding:0;font-family:inherit;font-size:14px;-moz-appearance:textfield}
#inDirectShare::-webkit-outer-spin-button,#inDirectShare::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#inDirectShare:focus{outline:none}
.save-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--sky-deep);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:18px;font-family:var(--font-btn)}
.save-btn.income{background:var(--sand-deep)}
.delete-btn{width:100%;padding:11px;border:1px solid var(--red);border-radius:12px;background:var(--red-soft);color:var(--red);font-size:13px;cursor:pointer;margin-top:8px;font-family:var(--font-btn)}
.close-btn{background:none;border:none;font-size:18px;color:var(--ink-soft);cursor:pointer}

.recur-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

/* 보고서 */
.report-nav{display:flex;align-items:center;gap:8px}
.report-total-lbl{font-size:7.7px;color:var(--ink-soft);text-align:center;letter-spacing:2px;margin-bottom:3px}
.report-total-board{padding:23px 8px !important}
#weeksSection{margin-top:4px}
#donutSection{margin-top:14px}
.week-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.week-row:last-child{border-bottom:none}
.week-lbl{font-size:13px}
.week-range{font-size:10px;color:var(--ink-soft);margin-top:2px}
.week-amt{font-size:14px;font-weight:600}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut-legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.donut-legend-row{display:flex;align-items:center;gap:6px;font-size:12px;justify-content:flex-end}
.donut-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.donut-legend-name{color:var(--ink-soft);white-space:nowrap}
.donut-legend-val{font-weight:600;margin-left:10px;text-align:right}
.report-subsidy-box{margin-top:18px;font-size:12px;color:var(--ink)}
.report-subsidy-box b{color:var(--sand-deep)}
.report-toggle-panel{display:none;flex-direction:column;gap:10px;margin-bottom:14px;font-size:12px;color:var(--ink)}
.report-toggle-panel.open{display:flex}
.report-toggle-panel label{display:flex;align-items:center;gap:8px;cursor:pointer}
.report-toggle-panel .ul-text{display:inline-block;padding:0 0.6em;margin:0 -0.6em;border-bottom:1px solid var(--sky-deep);line-height:1.3}
.recur-item:last-child{border-bottom:none}
.recur-main{flex:1;font-size:13px}
.recur-meta{font-size:10px;color:var(--ink-soft);margin-top:2px}
.recur-del{background:none;border:none;color:var(--ink-soft);font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:9px 20px;border-radius:20px;font-size:12px;z-index:999;transition:transform .25s}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title" title="지금 시점으로 돌아가기">EXPENSE</div>
    <div class="hdr-btns">
      <button class="icon-btn" id="btnSync">🔄</button>
      <button class="icon-btn" id="btnReport">보고서</button>
      <button class="icon-btn" id="btnRecur">정기지출</button>
    </div>
  </header>

  <div style="position:relative">
    <div class="board-tabs">
      <button class="board-tab" data-p="today">TODAY</button>
      <button class="board-tab" data-p="week">WEEK</button>
      <button class="board-tab active" data-p="month">MONTH</button>
    </div>
    <div class="period-calendar" id="periodCalendar">
      <div class="cal-nav">
        <button class="icon-btn" id="calPrev">‹</button>
        <div id="calMonthLabel"></div>
        <button class="icon-btn" id="calNext">›</button>
        <button class="close-btn" id="calClose">✕</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
  <div class="split-board" id="splitBoard"></div>

  <div class="list-wrap" id="list"></div>
</div>

<div class="add-btn-wrap">
  <button class="add-text-btn" id="btnAddText">
    <span class="arrow-slot">▲</span>
    <span class="add-label">돈을 <span class="an-char">안</span>쓴다</span>
  </button>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-hdr" style="justify-content:flex-end"><button class="close-btn" id="closeAdd">✕</button></div>
    <div class="type-toggle">
      <button class="type-btn active" data-t="expense">지출</button>
      <button class="type-btn" data-t="income">수입</button>
    </div>

    <label class="form-lbl" id="amountLbl">금액 (실제 결제한 총액)</label>
    <div class="amount-row">
      <input class="form-input" id="inAmount" type="number" placeholder="예: 17000">
      <div class="amount-btns">
        <button class="amt-btn plus" data-add="10000">+만</button>
        <button class="amt-btn plus" data-add="1000">+천</button>
        <button class="amt-btn plus" data-add="100">+백</button>
        <button class="amt-btn minus" data-add="-10000">−만</button>
        <button class="amt-btn minus" data-add="-1000">−천</button>
        <button class="amt-btn minus" data-add="-100">−백</button>
      </div>
    </div>

    <div id="categoryField">
      <label class="form-lbl">카테고리</label>
      <select class="form-input" id="inCategorySelect">
        <option value="">선택 안 함 (기타로 집계)</option>
        <option value="식">식</option>
        <option value="주">주</option>
        <option value="의">의</option>
        <option value="야옹">야옹</option>
        <option value="개인">개인</option>
        <option value="보험">보험</option>
        <option value="대출">대출</option>
      </select>
    </div>

    <label class="form-lbl">메모 (선택)</label>
    <input class="form-input" id="inMemo" placeholder="예: 티빙 구독, 점심식사...">

    <div id="expenseOnlyFields">
      <label class="form-lbl">결제수단</label>
      <div class="method-grid" id="methodGrid"></div>
      <div class="card-sub-grid" id="cardSubGrid" style="display:none"></div>

      <label class="form-lbl">몇 명이서 나눴나요?</label>
      <div class="split-mode-toggle">
        <button class="split-mode-btn active" data-m="count">인원수로 나누기</button>
        <button class="split-mode-btn" data-m="direct">내 몫 직접 입력</button>
      </div>
      <div class="split-row" id="splitCountRow">
        <input class="form-input" id="inSplit" type="number" min="1" value="1">
        <div class="share-preview" id="sharePreview" style="flex:1">내 몫: <b>0원</b></div>
      </div>
      <div class="split-row" id="splitDirectRow" style="display:none">
        <div class="share-preview share-preview-input" style="flex:1;margin-top:0">내 몫: <input id="inDirectShare" type="number" placeholder="0">원</div>
      </div>
    </div>

    <label class="form-lbl">날짜</label>
    <input class="form-input" id="inDate" type="date">
    <button class="save-btn" id="btnSave">저장</button>
    <button class="delete-btn" id="btnDelete" style="display:none">삭제</button>
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="modal" id="reportCaptureArea">
    <div class="modal-hdr">
      <div class="report-nav">
        <button class="icon-btn" id="reportPrev">‹</button>
        <span id="reportMonthLabel" class="modal-title" style="font-size:19px"></span>
        <button class="icon-btn" id="reportNext">›</button>
      </div>
      <div style="display:flex;gap:6px">
        <button class="save-report-btn" id="btnSaveReport" title="사진으로 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
        <button class="close-btn" id="closeReport">✕</button>
      </div>
    </div>

    <div class="report-total-lbl">TOTAL</div>
    <div class="split-board report-total-board" id="reportBoard" style="justify-content:center;max-width:none;margin-bottom:18px;cursor:pointer" title="눌러서 보고 싶은 항목 고르기"></div>

    <div class="report-toggle-panel" id="reportTogglePanel">
      <label><input type="checkbox" id="chkShowWeeks" checked> <span class="ul-text">주차별 지출 보기</span></label>
      <label><input type="checkbox" id="chkShowDonut" checked> <span class="ul-text">카테고리별 지출 보기</span></label>
    </div>

    <div id="weeksSection">
      <div id="reportWeeks"></div>
    </div>

    <div id="donutSection">
      <div class="donut-wrap">
        <svg id="donutChart" viewBox="0 0 160 160" width="169" height="169"></svg>
        <div id="donutLegend" class="donut-legend"></div>
      </div>
    </div>

    <div class="report-subsidy-box" id="reportSubsidyBox" style="display:none">
      지원금으로 낸 금액 (총 지출에 미포함): <b id="reportSubsidyVal">0원</b>
      <div style="height:34px"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="recurModal">
  <div class="modal">
    <div class="modal-hdr"><span class="modal-title">정기 지출</span><button class="close-btn" id="closeRecur">✕</button></div>
    <div id="recurList"></div>
    <div style="height:1px;background:var(--line);margin:14px 0"></div>
    <label class="form-lbl">이름</label>
    <input class="form-input" id="recurName" placeholder="예: 티빙 구독">
    <label class="form-lbl">카테고리</label>
    <select class="form-input" id="recurCategory">
      <option value="기타">선택 안 함 (기타로 집계)</option>
      <option value="식">식</option>
      <option value="주">주</option>
      <option value="의">의</option>
      <option value="야옹">야옹</option>
      <option value="개인">개인</option>
      <option value="보험">보험</option>
      <option value="대출">대출</option>
    </select>
    <label class="form-lbl">금액</label>
    <input class="form-input" id="recurAmount" type="number">
    <label class="form-lbl">결제수단</label>
    <div class="method-grid" id="recurMethodGrid"></div>
    <div class="card-sub-grid" id="recurCardSubGrid" style="display:none"></div>
    <label class="form-lbl">분할 인원</label>
    <input class="form-input" id="recurSplit" type="number" min="1" value="1">
    <label class="form-lbl">매달 며칠에 결제되나요?</label>
    <input class="form-input" id="recurDay" type="number" min="1" max="28" placeholder="1~28">
    <button class="save-btn" id="btnRecurSave">정기 지출 추가</button>
  </div>
</div>

<script>
const METHODS = ['카드', '카카오페이', '네이버페이', '계좌이체', '현금'];
const CARD_TYPES = ['카카오', '현대', '토스', '우리', '지원금'];
let records = JSON.parse(localStorage.getItem('expense_records_v1') || '[]');
let templates = JSON.parse(localStorage.getItem('expense_templates_v1') || '[]');
let curType = 'expense', curMethod = '카드', curCardType = null, curSplitMode = 'count', curRecurMethod = '카드', curRecurCardType = null;
let editingId = null;
let boardPeriod = 'month';
let listPeriod = 'month'; // 목록에 어떤 기간 항목을 보여줄지 - 평소엔 boardPeriod와 같이 움직이지만, 타이틀을 누르면 둘이 달라짐(전광판=오늘, 목록=이번달)

const generateId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function save() { localStorage.setItem('expense_records_v1', JSON.stringify(records)); }
function saveTemplates() { localStorage.setItem('expense_templates_v1', JSON.stringify(templates)); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function won(n) { return Math.round(n || 0).toLocaleString('ko-KR') + '원'; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1100); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function methodLabel(r) { return r.cardType ? `카드(${r.cardType})` : r.method; }

/* ═══════ 정기 지출 자동 생성 ═══════ */
function spawnRecurring() {
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth();
  let changed = false;
  templates.forEach(tpl => {
    const day = Math.min(tpl.day, new Date(y, m + 1, 0).getDate());
    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    if (dateStr > todayStr()) return;
    const already = records.some(r => r.templateId === tpl.id && r.date.slice(0, 7) === dateStr.slice(0, 7));
    if (already) return;
    records.push({
      id: generateId(), type: 'expense', name: tpl.name, amount: tpl.amount, splitCount: tpl.splitCount || 1,
      myShare: tpl.amount / (tpl.splitCount || 1), method: tpl.method, cardType: tpl.cardType || null, category: tpl.category || '기타',
      date: dateStr, templateId: tpl.id, addedAt: Date.now(), updatedAt: Date.now(), notionPageId: null
    });
    changed = true;
  });
  if (changed) { save(); autoPushAll(); }
}

/* ═══════ 전광판(split-flap) + 다른 날짜 보기 ═══════ */
let viewMode = 'live'; // 'live' = 지금 시점 기준, 'custom' = 특정 날짜를 골라서 보는 중
let customDate = null;
function getRefDate() { return customDate || new Date(); }
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function getPeriodRange(period, refDate) {
  const d = refDate || new Date();
  if (period === 'today') { const s = toDateStr(d); return { start: s, end: s }; }
  if (period === 'week') {
    const weekStart = new Date(d); weekStart.setDate(d.getDate() - d.getDay());
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
    return { start: toDateStr(weekStart), end: toDateStr(weekEnd) };
  }
  const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
  const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start: toDateStr(monthStart), end: toDateStr(monthEnd) };
}
function computeTotal(period) {
  const { start, end } = getPeriodRange(period, getRefDate());
  const expenses = records.filter(r => r.type === 'expense' && r.cardType !== '지원금' && r.date >= start && r.date <= end);
  return expenses.reduce((s, r) => s + (r.myShare || 0), 0);
}
// 5x7 도트매트릭스 숫자 패턴 (LED 전광판 폰트)
const DOT_DIGITS = {
  '0': ['01110','10001','10011','10101','11001','10001','01110'],
  '1': ['00100','01100','00100','00100','00100','00100','01110'],
  '2': ['01110','10001','00001','00010','00100','01000','11111'],
  '3': ['11111','00010','00100','00010','00001','10001','01110'],
  '4': ['00010','00110','01010','10010','11111','00010','00010'],
  '5': ['11111','10000','11110','00001','00001','10001','01110'],
  '6': ['00110','01000','10000','11110','10001','10001','01110'],
  '7': ['11111','00001','00010','00100','01000','01000','01000'],
  '8': ['01110','10001','10001','01110','10001','10001','01110'],
  '9': ['01110','10001','10001','01111','00001','00010','01100']
};
function dotDigitSVG(digit, size) {
  const grid = DOT_DIGITS[digit] || DOT_DIGITS['0'];
  let dots = '';
  grid.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      dots += `<circle cx="${x * size + size / 2}" cy="${y * size + size / 2}" r="${size * 0.38}" fill="${ch === '1' ? '#ff9900' : '#33210c'}"/>`;
    });
  });
  const w = 5 * size, h = 7 * size;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${dots}</svg>`;
}
function matchBoardWidthToTitle() {
  const titleW = document.querySelector('.title').getBoundingClientRect().width;
  document.getElementById('splitBoard').style.maxWidth = titleW + 'px';
  document.querySelector('.board-tabs').style.maxWidth = titleW + 'px';
}
// ₩ 기호도 도트로 (W 모양 + 가로줄 두 개)
function dotCommaSVG(size) {
  // 쉼표는 자릿수 사이 작은 점+꼬리 표시 (숫자보다 살짝 작게, 아래쪽에 배치)
  const w = 3 * size, h = 7 * size;
  const cx = w / 2, cy = h - size * 1.3;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><circle cx="${cx}" cy="${cy}" r="${size * 0.38}" fill="#ff9900"/><rect x="${cx - size * 0.22}" y="${cy}" width="${size * 0.44}" height="${size * 0.9}" fill="#ff9900"/></svg>`;
}
function renderBoard() {
  matchBoardWidthToTitle();
  const total = Math.round(computeTotal(boardPeriod));
  const formatted = total.toLocaleString('ko-KR'); // 천단위 콤마 포함, 예: "15,500"
  const chars = [...formatted];
  const board = document.getElementById('splitBoard');
  const availableW = board.getBoundingClientRect().width || 100;
  const unitCount = chars.reduce((n, c) => n + (c === ',' ? 3 : 5), 0);
  const dotSize = Math.max(1.4, Math.min(3, (availableW - 12) / (unitCount + 4)));
  board.innerHTML = chars.map(c => c === ',' ? dotCommaSVG(dotSize) : dotDigitSVG(c, dotSize)).join('');
}
document.querySelectorAll('.board-tab').forEach(b => b.addEventListener('click', () => {
  const alreadyActive = b.classList.contains('active');
  if (alreadyActive) {
    openPeriodCalendar(b.dataset.p);
    return;
  }
  document.querySelectorAll('.board-tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  boardPeriod = b.dataset.p;
  listPeriod = b.dataset.p; // 탭을 고르면 목록도 같은 기간으로 맞춰짐
  viewMode = 'live'; customDate = null;
  closePeriodCalendar();
  renderBoard(); renderList();
}));

/* ═══════ 날짜 선택 달력 (탭을 한 번 더 누르면 뜸) ═══════ */
let calViewDate = new Date();
function openPeriodCalendar(period) {
  boardPeriod = period;
  calViewDate = customDate ? new Date(customDate) : new Date();
  renderPeriodCalendar();
  document.getElementById('periodCalendar').classList.add('open');
}
function closePeriodCalendar() { document.getElementById('periodCalendar').classList.remove('open'); }
function renderPeriodCalendar() {
  const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
  document.getElementById('calMonthLabel').textContent = `${y}.${String(m + 1).padStart(2, '0')}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['일', '월', '화', '수', '목', '금', '토'].forEach(d => {
    const el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el);
  });
  const startOffset = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < startOffset; i++) { const el = document.createElement('div'); el.className = 'cal-day empty'; grid.appendChild(el); }
  for (let d = 1; d <= daysInMonth; d++) {
    const el = document.createElement('div'); el.className = 'cal-day'; el.textContent = d;
    el.onclick = () => {
      customDate = new Date(y, m, d);
      viewMode = 'custom';
      closePeriodCalendar();
      renderBoard(); renderList();
    };
    grid.appendChild(el);
  }
}
document.getElementById('calPrev').onclick = () => { calViewDate.setMonth(calViewDate.getMonth() - 1); renderPeriodCalendar(); };
document.getElementById('calNext').onclick = () => { calViewDate.setMonth(calViewDate.getMonth() + 1); renderPeriodCalendar(); };
document.getElementById('calClose').onclick = closePeriodCalendar;

// 앱 타이틀을 누르면: 전광판은 "오늘" 기준으로, 목록은 평소처럼 "이번 달" 전체로 돌아옴
document.querySelector('.title').addEventListener('click', () => {
  viewMode = 'live'; customDate = null;
  boardPeriod = 'today';
  listPeriod = 'month';
  document.querySelectorAll('.board-tab').forEach(x => x.classList.toggle('active', x.dataset.p === 'today'));
  closePeriodCalendar();
  renderBoard(); renderList();
});


/* ═══════ 목록 렌더 (클릭하면 수정화면) ═══════ */
function renderList() {
  const el = document.getElementById('list');
  const { start, end } = viewMode === 'custom' ? getPeriodRange(boardPeriod, customDate) : getPeriodRange(listPeriod, new Date());
  const filtered = records.filter(r => r.date >= start && r.date <= end);
  const sorted = [...filtered].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.addedAt - a.addedAt);
  if (!sorted.length) { el.innerHTML = `<div class="empty">이 기간엔 기록이 없어요. 아래 버튼을 눌러 추가해보세요</div>`; renderBoard(); return; }
  el.innerHTML = sorted.map(r => {
    const d = new Date(r.date + 'T00:00:00');
    const dayNum = d.getDate();
    const monLabel = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'][d.getMonth()];
    const metaParts = [];
    if (r.type === 'expense') { metaParts.push(esc(methodLabel(r))); if (r.splitCount > 1) metaParts.push(`${r.splitCount}명 분할`); }
    return `
    <div class="list-entry" data-id="${r.id}">
      <div class="le-date-badge ${r.type}"><div class="d">${dayNum}</div><div class="m">${monLabel}</div></div>
      <div class="le-main">
        <div class="le-cat">${esc(r.name || r.category || '(제목 없음)')}</div>
        ${metaParts.length ? `<div class="le-meta">${metaParts.join(' · ')}</div>` : ''}
      </div>
      <div class="le-amt">
        <div class="le-share">${won(r.myShare)}</div>
        ${r.splitCount > 1 || (r.myShare !== r.amount && r.type === 'expense') ? `<div class="le-total">총 ${won(r.amount)}</div>` : ''}
      </div>
    </div>
  `;
  }).join('');
  el.querySelectorAll('.list-entry').forEach(row => row.addEventListener('click', () => openEdit(row.dataset.id)));
  renderBoard();
}

/* ═══════ 결제수단/카드종류 그리드 ═══════ */
function buildMethodGrid(container, subContainer, selectedMethod, selectedCard, onMethod, onCard) {
  container.innerHTML = METHODS.map(m => `<div class="method-opt${m === selectedMethod ? ' active' : ''}" data-m="${m}">${m}</div>`).join('');
  const renderSub = () => {
    if (selectedMethod === '카드') {
      subContainer.style.display = 'flex';
      subContainer.innerHTML = CARD_TYPES.map(c => `<div class="card-sub-opt${c === selectedCard ? ' active' : ''}" data-c="${c}">${c}</div>`).join('');
      subContainer.querySelectorAll('.card-sub-opt').forEach(el => el.addEventListener('click', () => {
        subContainer.querySelectorAll('.card-sub-opt').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        onCard(el.dataset.c);
      }));
    } else {
      subContainer.style.display = 'none';
      onCard(null);
    }
  };
  container.querySelectorAll('.method-opt').forEach(el => el.addEventListener('click', () => {
    container.querySelectorAll('.method-opt').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    selectedMethod = el.dataset.m;
    onMethod(selectedMethod);
    renderSub();
  }));
  renderSub();
}

function updateSharePreview() {
  const amt = parseFloat(document.getElementById('inAmount').value) || 0;
  const split = parseInt(document.getElementById('inSplit').value) || 1;
  document.getElementById('sharePreview').innerHTML = `내 몫: <b>${won(amt / split)}</b>`;
}
document.getElementById('inAmount').addEventListener('input', updateSharePreview);
document.getElementById('inSplit').addEventListener('input', updateSharePreview);
document.querySelectorAll('.amt-btn').forEach(b => b.addEventListener('click', () => {
  const cur = parseFloat(document.getElementById('inAmount').value) || 0;
  const next = Math.max(0, cur + parseInt(b.dataset.add));
  document.getElementById('inAmount').value = next;
  updateSharePreview();
}));

document.querySelectorAll('.split-mode-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.split-mode-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  curSplitMode = b.dataset.m;
  document.getElementById('splitCountRow').style.display = curSplitMode === 'count' ? 'flex' : 'none';
  document.getElementById('splitDirectRow').style.display = curSplitMode === 'direct' ? 'flex' : 'none';
}));

document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.type-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  curType = b.dataset.t;
  document.getElementById('expenseOnlyFields').style.display = curType === 'expense' ? '' : 'none';
  document.getElementById('categoryField').style.display = curType === 'expense' ? '' : 'none';
  document.getElementById('amountLbl').textContent = curType === 'expense' ? '금액 (실제 결제한 총액)' : '금액';
  document.getElementById('btnSave').classList.toggle('income', curType === 'income');
}));

function resetAddModal() {
  editingId = null;
  curType = 'expense'; curMethod = '카드'; curCardType = null; curSplitMode = 'count';
  document.querySelectorAll('.type-btn').forEach(x => x.classList.toggle('active', x.dataset.t === 'expense'));
  document.getElementById('expenseOnlyFields').style.display = '';
  document.getElementById('categoryField').style.display = '';
  document.getElementById('amountLbl').textContent = '금액 (실제 결제한 총액)';
  document.getElementById('btnSave').classList.remove('income');
  document.getElementById('inAmount').value = '';
  document.getElementById('inCategorySelect').value = '';
  document.getElementById('inMemo').value = '';
  document.getElementById('inSplit').value = 1;
  document.getElementById('inDirectShare').value = '';
  document.getElementById('inDate').value = todayStr();
  document.querySelectorAll('.split-mode-btn').forEach(x => x.classList.toggle('active', x.dataset.m === 'count'));
  document.getElementById('splitCountRow').style.display = 'flex';
  document.getElementById('splitDirectRow').style.display = 'none';
  document.getElementById('btnDelete').style.display = 'none';
  buildMethodGrid(document.getElementById('methodGrid'), document.getElementById('cardSubGrid'), curMethod, curCardType, (m) => curMethod = m, (c) => curCardType = c);
  updateSharePreview();
}
document.getElementById('btnAddText').onclick = () => { resetAddModal(); document.getElementById('addModal').classList.add('open'); };
document.getElementById('closeAdd').onclick = () => document.getElementById('addModal').classList.remove('open');

function openEdit(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  curType = r.type; curMethod = r.method || '카드'; curCardType = r.cardType || null;
  curSplitMode = (r.splitCount && r.splitCount > 1) ? 'count' : (r.myShare !== r.amount ? 'direct' : 'count');
  document.querySelectorAll('.type-btn').forEach(x => x.classList.toggle('active', x.dataset.t === r.type));
  document.getElementById('expenseOnlyFields').style.display = r.type === 'expense' ? '' : 'none';
  document.getElementById('categoryField').style.display = r.type === 'expense' ? '' : 'none';
  document.getElementById('amountLbl').textContent = r.type === 'expense' ? '금액 (실제 결제한 총액)' : '금액';
  document.getElementById('btnSave').classList.toggle('income', r.type === 'income');
  document.getElementById('inAmount').value = r.amount;
  const knownCats = ['식', '주', '의', '야옹', '개인'];
  if (knownCats.includes(r.category)) {
    document.getElementById('inCategorySelect').value = r.category;
    document.getElementById('inMemo').value = (r.name && r.name !== r.category) ? r.name : '';
  } else {
    document.getElementById('inCategorySelect').value = '';
    document.getElementById('inMemo').value = r.name || r.category || '';
  }
  document.getElementById('inSplit').value = r.splitCount || 1;
  document.getElementById('inDirectShare').value = r.myShare;
  document.getElementById('inDate').value = r.date;
  document.querySelectorAll('.split-mode-btn').forEach(x => x.classList.toggle('active', x.dataset.m === curSplitMode));
  document.getElementById('splitCountRow').style.display = curSplitMode === 'count' ? 'flex' : 'none';
  document.getElementById('splitDirectRow').style.display = curSplitMode === 'direct' ? 'flex' : 'none';
  document.getElementById('btnDelete').style.display = '';
  buildMethodGrid(document.getElementById('methodGrid'), document.getElementById('cardSubGrid'), curMethod, curCardType, (m) => curMethod = m, (c) => curCardType = c);
  updateSharePreview();
  document.getElementById('addModal').classList.add('open');
}

document.getElementById('btnSave').onclick = () => {
  const amount = parseFloat(document.getElementById('inAmount').value);
  const category = curType === 'income' ? '수입' : (document.getElementById('inCategorySelect').value || '기타');
  const memo = document.getElementById('inMemo').value.trim();
  const category_name = memo || category;
  const date = document.getElementById('inDate').value || todayStr();
  if (!amount) { toast('금액을 입력해주세요'); return; }

  let splitCount = 1, myShare = amount;
  if (curType === 'expense') {
    if (curSplitMode === 'count') {
      splitCount = parseInt(document.getElementById('inSplit').value) || 1;
      myShare = amount / splitCount;
    } else {
      myShare = parseFloat(document.getElementById('inDirectShare').value);
      if (isNaN(myShare)) myShare = amount;
      splitCount = 1;
    }
  }

  if (editingId) {
    const r = records.find(x => x.id === editingId);
    Object.assign(r, {
      type: curType, name: category_name, category, amount,
      splitCount: curType === 'expense' ? splitCount : 1,
      myShare: curType === 'expense' ? myShare : amount,
      method: curType === 'expense' ? curMethod : null,
      cardType: curType === 'expense' ? curCardType : null,
      date, updatedAt: Date.now()
    });
    save(); renderList();
    document.getElementById('addModal').classList.remove('open');
    toast('수정했어요');
    autoPush(r);
  } else {
    const rec = {
      id: generateId(), type: curType, name: category_name, category, amount,
      splitCount: curType === 'expense' ? splitCount : 1,
      myShare: curType === 'expense' ? myShare : amount,
      method: curType === 'expense' ? curMethod : null,
      cardType: curType === 'expense' ? curCardType : null,
      date, templateId: null, addedAt: Date.now(), updatedAt: Date.now(), notionPageId: null
    };
    records.push(rec);
    save(); renderList();
    document.getElementById('addModal').classList.remove('open');
    toast('저장했어요');
    autoPush(rec);
  }
};
document.getElementById('btnDelete').onclick = () => {
  if (!editingId || !confirm('이 기록을 삭제할까요?')) return;
  const rec = records.find(r => r.id === editingId);
  records = records.filter(r => r.id !== editingId);
  save(); renderList();
  document.getElementById('addModal').classList.remove('open');
  if (rec && rec.notionPageId) autoDelete(rec.notionPageId);
  toast('삭제했어요');
};

/* ═══════ 정기 지출 모달 ═══════ */
function renderRecurList() {
  const el = document.getElementById('recurList');
  if (!templates.length) { el.innerHTML = `<div class="empty" style="padding:16px">등록된 정기 지출이 없어요</div>`; return; }
  el.innerHTML = templates.map(t => `
    <div class="recur-item">
      <div class="recur-main">${esc(t.name)}<div class="recur-meta">매달 ${t.day}일 · ${won(t.amount)}${t.splitCount > 1 ? ` · ${t.splitCount}명 분할 (내 몫 ${won(t.amount / t.splitCount)})` : ''} · ${t.cardType ? `카드(${t.cardType})` : t.method}</div></div>
      <button class="recur-del" data-id="${t.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.recur-del').forEach(b => b.addEventListener('click', () => {
    templates = templates.filter(t => t.id !== b.dataset.id);
    saveTemplates(); renderRecurList();
  }));
}
/* ═══════ 보고서 ═══════ */
const CATEGORY_COLORS = { '식': '#DF928E', '주': '#D1DEDE', '의': '#C58882', '야옹': '#EFDCBE', '개인': '#ADDDFF', '보험': '#C9B8D4', '대출': '#D9B872', '기타': '#B8C4A9' };
let reportDate = new Date();

function renderReport() {
  const y = reportDate.getFullYear(), m = reportDate.getMonth();
  document.getElementById('reportMonthLabel').textContent = `${y}년 ${m + 1}월`;
  const monthStr = `${y}-${String(m + 1).padStart(2, '0')}`;
  const monthExpenses = records.filter(r => r.type === 'expense' && r.date.slice(0, 7) === monthStr);
  const normal = monthExpenses.filter(r => r.cardType !== '지원금');
  const subsidy = monthExpenses.filter(r => r.cardType === '지원금');

  const total = normal.reduce((s, r) => s + (r.myShare || 0), 0);
  const reportBoardEl = document.getElementById('reportBoard');
  const formattedTotal = Math.round(total).toLocaleString('ko-KR');
  const reportChars = [...formattedTotal];
  reportBoardEl.innerHTML = reportChars.map(c => c === ',' ? dotCommaSVG(3.9) : dotDigitSVG(c, 3.9)).join('');

  // 주차별
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const firstDow = new Date(y, m, 1).getDay();
  const weeks = {};
  for (let day = 1; day <= daysInMonth; day++) {
    const wn = Math.ceil((day + firstDow) / 7);
    if (!weeks[wn]) weeks[wn] = { total: 0, minDay: day, maxDay: day };
    weeks[wn].maxDay = day;
  }
  normal.forEach(r => {
    const day = parseInt(r.date.slice(8, 10), 10);
    const wn = Math.ceil((day + firstDow) / 7);
    if (weeks[wn]) weeks[wn].total += (r.myShare || 0);
  });
  const weeksEl = document.getElementById('reportWeeks');
  weeksEl.innerHTML = Object.keys(weeks).sort((a, b) => a - b).map(wn => {
    const w = weeks[wn];
    return `<div class="week-row">
      <div><div class="week-lbl">${wn}주차</div><div class="week-range">${m + 1}월 ${w.minDay}일~${w.maxDay}일</div></div>
      <div class="week-amt">${won(w.total)}</div>
    </div>`;
  }).join('');

  // 카테고리별 도넛
  const catTotals = {};
  normal.forEach(r => { const c = r.category || '기타'; catTotals[c] = (catTotals[c] || 0) + (r.myShare || 0); });
  const catEntries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
  renderDonut(catEntries, total);

  // 지원금
  const subsidyTotal = subsidy.reduce((s, r) => s + (r.myShare || 0), 0);
  document.getElementById('reportSubsidyBox').style.display = subsidyTotal > 0 ? 'block' : 'none';
  document.getElementById('reportSubsidyVal').textContent = won(subsidyTotal);
}

function renderDonut(catEntries, total) {
  const svg = document.getElementById('donutChart');
  const legend = document.getElementById('donutLegend');
  if (!total || !catEntries.length) {
    svg.innerHTML = `<circle cx="80" cy="80" r="58.5" fill="none" stroke="#eee" stroke-width="36"/>`;
    legend.innerHTML = `<div class="empty" style="padding:0;text-align:left">이 달 지출 기록이 없어요</div>`;
    return;
  }
  const r = 58.5, cx = 80, cy = 80, circumference = 2 * Math.PI * r;
  let offset = 0;
  let circles = '';
  catEntries.forEach(([cat, amt]) => {
    const frac = amt / total;
    const len = frac * circumference;
    const color = CATEGORY_COLORS[cat] || '#c9c9c9';
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="36" stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
  });
  svg.innerHTML = circles;
  legend.innerHTML = catEntries.map(([cat, amt]) => `
    <div class="donut-legend-row">
      <span class="donut-dot" style="background:${CATEGORY_COLORS[cat] || '#c9c9c9'}"></span>
      <span class="donut-legend-name">${esc(cat)} (${Math.round(amt / total * 100)}%)</span>
      <span class="donut-legend-val">${won(amt)}</span>
    </div>`).join('');
}

function applyReportSectionVisibility() {
  const showWeeks = document.getElementById('chkShowWeeks').checked;
  const showDonut = document.getElementById('chkShowDonut').checked;
  document.getElementById('weeksSection').style.display = showWeeks ? '' : 'none';
  document.getElementById('donutSection').style.display = showDonut ? '' : 'none';
  localStorage.setItem('report_show_weeks', showWeeks ? '1' : '0');
  localStorage.setItem('report_show_donut', showDonut ? '1' : '0');
}
document.getElementById('reportBoard').addEventListener('click', () => {
  document.getElementById('reportTogglePanel').classList.toggle('open');
});
document.getElementById('chkShowWeeks').addEventListener('change', applyReportSectionVisibility);
document.getElementById('chkShowDonut').addEventListener('change', applyReportSectionVisibility);

document.getElementById('btnReport').onclick = () => {
  reportDate = new Date();
  document.getElementById('chkShowWeeks').checked = localStorage.getItem('report_show_weeks') !== '0';
  document.getElementById('chkShowDonut').checked = localStorage.getItem('report_show_donut') !== '0';
  applyReportSectionVisibility();
  renderReport();
  document.getElementById('reportModal').classList.add('open');
};
document.getElementById('closeReport').onclick = () => document.getElementById('reportModal').classList.remove('open');
document.getElementById('reportPrev').onclick = () => { reportDate.setMonth(reportDate.getMonth() - 1); renderReport(); };
document.getElementById('reportNext').onclick = () => { reportDate.setMonth(reportDate.getMonth() + 1); renderReport(); };
document.getElementById('btnSaveReport').onclick = async () => {
  const prev = document.getElementById('reportPrev'), next = document.getElementById('reportNext');
  const saveBtn = document.getElementById('btnSaveReport'), closeBtn = document.getElementById('closeReport');
  const togglePanel = document.getElementById('reportTogglePanel');
  const wasOpen = togglePanel.classList.contains('open');
  togglePanel.classList.remove('open');
  prev.style.visibility = 'hidden'; next.style.visibility = 'hidden';
  saveBtn.style.visibility = 'hidden'; closeBtn.style.visibility = 'hidden';
  try {
    const canvas = await html2canvas(document.getElementById('reportCaptureArea'), { backgroundColor: '#ffffff', scale: 2 });
    const a = document.createElement('a');
    a.download = `가계부_보고서_${reportDate.getFullYear()}-${String(reportDate.getMonth() + 1).padStart(2, '0')}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('저장했어요');
  } catch (e) { toast('저장 실패'); }
  finally {
    prev.style.visibility = ''; next.style.visibility = '';
    saveBtn.style.visibility = ''; closeBtn.style.visibility = '';
    if (wasOpen) togglePanel.classList.add('open');
  }
};

document.getElementById('btnRecur').onclick = () => {
  curRecurMethod = '카드'; curRecurCardType = null;
  document.getElementById('recurName').value = '';
  document.getElementById('recurCategory').value = '기타';
  document.getElementById('recurAmount').value = '';
  document.getElementById('recurSplit').value = 1;
  document.getElementById('recurDay').value = '';
  buildMethodGrid(document.getElementById('recurMethodGrid'), document.getElementById('recurCardSubGrid'), curRecurMethod, curRecurCardType, (m) => curRecurMethod = m, (c) => curRecurCardType = c);
  renderRecurList();
  document.getElementById('recurModal').classList.add('open');
};
document.getElementById('closeRecur').onclick = () => document.getElementById('recurModal').classList.remove('open');
document.getElementById('btnRecurSave').onclick = () => {
  const name = document.getElementById('recurName').value.trim();
  const category = document.getElementById('recurCategory').value || '기타';
  const amount = parseFloat(document.getElementById('recurAmount').value);
  const split = parseInt(document.getElementById('recurSplit').value) || 1;
  const day = parseInt(document.getElementById('recurDay').value);
  if (!name || !amount || !day) { toast('이름/금액/날짜를 입력해주세요'); return; }
  templates.push({ id: generateId(), name, category, amount, splitCount: split, method: curRecurMethod, cardType: curRecurCardType, day });
  saveTemplates(); renderRecurList();
  toast('정기 지출 추가됨');
  spawnRecurring(); renderList();
};

/* ═══════ 노션 동기화 ═══════ */
const NOTION_ENDPOINT = '/api/notion?app=expense';
function setSyncSpin(on) { document.getElementById('btnSync').style.animation = on ? 'spin 1s linear infinite' : ''; }
function payload(r) {
  return { appId: r.id, notionPageId: r.notionPageId || null, name: r.name, date: r.date,
    amount: r.amount, splitCount: r.splitCount, myShare: r.myShare,
    method: r.cardType ? `카드(${r.cardType})` : r.method,
    category: r.category, type: r.type, updatedAt: new Date(r.updatedAt || r.addedAt).toISOString() };
}
async function autoPush(rec) {
  setSyncSpin(true);
  try {
    const r = await fetch(NOTION_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: [payload(rec)] }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '업로드 실패');
    const result = (data.results || [])[0];
    if (result && result.notionPageId) { rec.notionPageId = result.notionPageId; save(); }
  } catch (e) { console.warn('동기화 실패:', e.message); }
  finally { setSyncSpin(false); }
}
async function autoPushAll() { for (const r of records) if (!r.notionPageId) await autoPush(r); }
async function autoDelete(pageId) {
  try { await fetch(NOTION_ENDPOINT, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pageId }) }); }
  catch (e) { console.warn('삭제 실패:', e.message); }
}
document.getElementById('btnSync').onclick = async () => {
  if (!records.length) { toast('동기화할 기록이 없어요'); return; }
  toast('동기화 중...');
  for (const r of records) await autoPush(r);
  toast('동기화 완료');
};

spawnRecurring();
renderList();
