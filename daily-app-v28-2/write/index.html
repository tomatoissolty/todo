<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>글쓰기</title>
<style>
@font-face {
  font-family: 'TAEBAEKfont';
  src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/TAEBAEKfont.woff2') format('woff2');
  font-weight: normal; font-display: swap;
}
@font-face {
  font-family: 'LeeSunSinDotum';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/YiSunShinDotumM.woff') format('woff');
  font-weight: normal; font-display: swap;
}

:root{
  --paper:#f5efe0; --card:#fffcf3; --ink:#2a2620; --ink-soft:#8a8071;
  --stamp:#b23a2f; --stamp-soft:#e9d9c9; --line:#ddd0b4; --line-soft:#eae1cc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); min-height:100vh;
  font-family:-apple-system,'Noto Sans KR',sans-serif;
  background-image:
    radial-gradient(circle at 100% 0%, rgba(178,58,47,0.05), transparent 40%);
}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 100px}

/* ── Header ── */
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.logo{font-family:'TAEBAEKfont',sans-serif;font-size:28px;letter-spacing:1px}
.logo span{color:var(--stamp)}
.btn-new{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:12px;font-weight:700;border-radius:3px;cursor:pointer;letter-spacing:.5px}
.btn-new:active{transform:translateY(1px)}

/* ── List ── */
.entry{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;
  cursor:pointer;transition:border-color .15s, transform .1s;
}
.entry:hover{border-color:var(--stamp)}
.entry:active{transform:scale(.995)}
.stamp{
  flex-shrink:0;width:46px;height:46px;border:2px solid var(--stamp);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--stamp);transform:rotate(-3deg);
}
.stamp .d{font-size:17px;font-weight:800;line-height:1}
.stamp .m{font-size:9px;letter-spacing:.5px;margin-top:1px}
.entry-body{flex:1;min-width:0}
.entry-title{font-family:'TAEBAEKfont',sans-serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{display:flex;align-items:center;gap:6px;margin-top:4px}
.tag{font-size:10px;color:var(--stamp);background:var(--stamp-soft);padding:2px 8px;border-radius:10px;font-weight:700}
.entry-arrow{color:var(--ink-soft);flex-shrink:0}
.empty{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:13px;line-height:1.7}
.empty b{display:block;font-family:'TAEBAEKfont',sans-serif;font-size:16px;color:var(--ink);margin-bottom:6px}

/* ── Read view ── */
.screen{display:none}
.screen.active{display:block}
.back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.btn-back{background:none;border:none;font-size:13px;color:var(--ink-soft);cursor:pointer;padding:6px 0}
.btn-back:hover{color:var(--ink)}
.action-row{display:flex;gap:8px}
.btn-icon{border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn-icon:hover{border-color:var(--stamp);color:var(--stamp)}
.btn-icon.danger:hover{border-color:#a33;color:#a33}

.read-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:32px 26px}
.read-title{font-family:'TAEBAEKfont',sans-serif;font-size:24px;line-height:1.4;word-break:keep-all}
.read-meta{display:flex;align-items:center;gap:10px;margin:10px 0 22px;font-size:12px;color:var(--ink-soft)}
.read-body{
  font-family:'LeeSunSinDotum',sans-serif;font-size:16px;line-height:34px;
  white-space:pre-wrap;word-break:keep-all;color:var(--ink);
  background-image:repeating-linear-gradient(var(--card), var(--card) 33px, var(--line-soft) 33px, var(--line-soft) 34px);
}

/* ── Editor ── */
.editor-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:26px}
.field-lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;display:block}
.in-title{
  width:100%;border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-family:'TAEBAEKfont',sans-serif;font-size:22px;padding:6px 2px 12px;outline:none;margin-bottom:18px;
}
.in-title::placeholder{color:var(--ink-soft);opacity:.5}
.in-category{
  border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;font-size:12px;
  font-weight:700;color:var(--stamp);outline:none;width:100%;max-width:200px;margin-bottom:20px;background:var(--stamp-soft);
}
.in-category::placeholder{color:var(--stamp);opacity:.55}
.in-body{
  width:100%;min-height:320px;border:none;resize:vertical;outline:none;background:transparent;
  font-family:'LeeSunSinDotum',sans-serif;font-size:16px;line-height:34px;color:var(--ink);
  background-image:repeating-linear-gradient(transparent, transparent 33px, var(--line-soft) 33px, var(--line-soft) 34px);
}
.in-body::placeholder{color:var(--ink-soft)}
.editor-actions{display:flex;gap:8px;margin-top:20px}
.btn-save{flex:1;padding:13px;border:none;border-radius:6px;background:var(--stamp);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.btn-save:active{transform:translateY(1px)}
.btn-cancel{padding:13px 18px;border:1.5px solid var(--line);border-radius:6px;background:transparent;color:var(--ink-soft);font-size:14px;cursor:pointer}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:var(--paper);border-radius:20px;padding:9px 20px;font-size:12px;z-index:999;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">글<span>쓰기</span></div>
    <button class="btn-new" id="btnNew">+ 새 글</button>
  </header>

  <!-- LIST -->
  <div class="screen active" id="screen-list">
    <div id="list"></div>
  </div>

  <!-- READ -->
  <div class="screen" id="screen-read">
    <div class="back-row">
      <button class="btn-back" id="btnBackFromRead">← 목록으로</button>
      <div class="action-row">
        <button class="btn-icon" id="btnEdit">수정</button>
        <button class="btn-icon danger" id="btnDelete">삭제</button>
      </div>
    </div>
    <div class="read-card">
      <div class="read-title" id="readTitle"></div>
      <div class="read-meta">
        <span id="readDate"></span>
        <span class="tag" id="readCategory" style="display:none"></span>
      </div>
      <div class="read-body" id="readBody"></div>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="screen-edit">
    <div class="back-row">
      <button class="btn-back" id="btnBackFromEdit">← 취소</button>
    </div>
    <div class="editor-card">
      <input class="in-title" id="inTitle" placeholder="제목을 입력하세요">
      <input class="in-category" id="inCategory" list="categoryList" placeholder="# 카테고리">
      <datalist id="categoryList"></datalist>
      <textarea class="in-body" id="inBody" placeholder="오늘은 어떤 이야기를 남길까요..."></textarea>
      <div class="editor-actions">
        <button class="btn-save" id="btnSave">저장</button>
        <button class="btn-cancel" id="btnCancelEdit">취소</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const NOTION_ENDPOINT = '/api/notion?app=writing';
let entries = [];        // list (properties only, no body)
let editingPageId = null; // null = new entry
let editingCreatedDate = null; // preserved on edit, set fresh on create
let currentEntry = null; // full entry currently open in read view

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function localDateStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ════ LOAD LIST ════ */
async function loadList(){
  const el = document.getElementById('list');
  el.innerHTML = `<div class="empty">불러오는 중...</div>`;
  try{
    const r = await fetch(NOTION_ENDPOINT);
    const d = await r.json();
    if(!r.ok){ el.innerHTML = `<div class="empty">${esc(d.error||'불러오기 실패')}</div>`; return; }
    entries = (d.items||[]).sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
    renderList();
    renderCategoryOptions();
  }catch(err){
    el.innerHTML = `<div class="empty">불러오기 실패</div>`;
  }
}

function renderCategoryOptions(){
  const set = new Set(entries.map(e=>e.category).filter(Boolean));
  const dl = document.getElementById('categoryList');
  dl.innerHTML = [...set].map(c=>`<option value="${esc(c)}">`).join('');
}

function renderList(){
  const el = document.getElementById('list');
  if(!entries.length){
    el.innerHTML = `<div class="empty"><b>아직 쓴 글이 없어요</b>+ 새 글 버튼으로 첫 글을 남겨보세요</div>`;
    return;
  }
  el.innerHTML = '';
  entries.forEach(e=>{
    const d = e.date ? new Date(e.date) : null;
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <div class="stamp">
        <div class="d">${d ? d.getDate() : '-'}</div>
        <div class="m">${d ? (d.getMonth()+1)+'월' : ''}</div>
      </div>
      <div class="entry-body">
        <div class="entry-title">${esc(e.name || '(제목 없음)')}</div>
        <div class="entry-meta">
          <span style="font-size:11px;color:var(--ink-soft)">${fmtDate(e.date)}</span>
          ${e.category ? `<span class="tag">${esc(e.category)}</span>` : ''}
        </div>
      </div>
      <div class="entry-arrow">→</div>
    `;
    row.addEventListener('click', ()=> openRead(e));
    el.appendChild(row);
  });
}

/* ════ READ ════ */
async function openRead(entry){
  currentEntry = entry;
  document.getElementById('readTitle').textContent = entry.name || '(제목 없음)';
  document.getElementById('readDate').textContent = fmtDate(entry.date);
  const catEl = document.getElementById('readCategory');
  if(entry.category){ catEl.textContent = entry.category; catEl.style.display='inline-block'; }
  else { catEl.style.display='none'; }
  document.getElementById('readBody').textContent = '불러오는 중...';
  showScreen('screen-read');

  try{
    const r = await fetch(`${NOTION_ENDPOINT}&action=content&pageId=${encodeURIComponent(entry.notionPageId)}`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.error);
    const text = (d.content||[]).filter(seg=>seg.type==='text').map(seg=>seg.text||'').join('\n');
    document.getElementById('readBody').textContent = text || '(내용 없음)';
    currentEntry._bodyText = text;
  }catch(err){
    document.getElementById('readBody').textContent = '본문을 불러오지 못했어요.';
  }
}

document.getElementById('btnBackFromRead').onclick = ()=>{ showScreen('screen-list'); };

document.getElementById('btnDelete').onclick = async ()=>{
  if(!currentEntry) return;
  if(!confirm('이 글을 삭제할까요? 노션에서도 함께 보관 처리돼요.')) return;
  try{
    const r = await fetch(NOTION_ENDPOINT, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pageId: currentEntry.notionPageId })
    });
    if(!r.ok) throw new Error();
    toast('삭제했어요');
    showScreen('screen-list');
    loadList();
  }catch(err){ toast('삭제 실패'); }
};

document.getElementById('btnEdit').onclick = ()=>{
  if(!currentEntry) return;
  openEditor(currentEntry, currentEntry._bodyText || '');
};

/* ════ EDITOR ════ */
document.getElementById('btnNew').onclick = ()=> openEditor(null, '');
document.getElementById('btnBackFromEdit').onclick = ()=> showScreen(editingPageId ? 'screen-read' : 'screen-list');
document.getElementById('btnCancelEdit').onclick = ()=> showScreen(editingPageId ? 'screen-read' : 'screen-list');

function openEditor(entry, bodyText){
  editingPageId = entry ? entry.notionPageId : null;
  editingCreatedDate = entry ? entry.date : null;
  document.getElementById('inTitle').value = entry ? (entry.name||'') : '';
  document.getElementById('inCategory').value = entry ? (entry.category||'') : '';
  document.getElementById('inBody').value = bodyText || '';
  showScreen('screen-edit');
  document.getElementById('inTitle').focus();
}

document.getElementById('btnSave').onclick = async ()=>{
  const name = document.getElementById('inTitle').value.trim();
  const category = document.getElementById('inCategory').value.trim();
  const bodyText = document.getElementById('inBody').value;
  if(!name){ toast('제목을 입력해주세요'); return; }
  if(!bodyText.trim()){ toast('본문을 입력해주세요'); return; }

  const item = {
    appId: editingPageId ? (entries.find(e=>e.notionPageId===editingPageId)?.appId || Date.now().toString()) : Date.now().toString(),
    notionPageId: editingPageId || undefined,
    name, category,
    date: editingCreatedDate || localDateStr(),
    updatedAt: new Date().toISOString(),
    content: bodyText.split('\n').map(line=>({ type:'text', text: line }))
  };

  toast('저장 중...');
  try{
    const r = await fetch(NOTION_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ item })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || '저장 실패');
    toast('저장했어요');
    await loadList();
    const saved = entries.find(e=>e.notionPageId===d.notionPageId) ||
      { notionPageId:d.notionPageId, name, category, date:item.date };
    saved._bodyText = bodyText;
    currentEntry = saved;
    document.getElementById('readTitle').textContent = saved.name;
    document.getElementById('readDate').textContent = fmtDate(saved.date);
    const catEl = document.getElementById('readCategory');
    if(saved.category){ catEl.textContent = saved.category; catEl.style.display='inline-block'; } else { catEl.style.display='none'; }
    document.getElementById('readBody').textContent = bodyText;
    showScreen('screen-read');
  }catch(err){
    toast('저장 실패: ' + err.message);
  }
};

/* ════ INIT ════ */
loadList();
</script>
</body>
</html>
