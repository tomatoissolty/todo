<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHELF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#ffffff; --surface:#f6f7f8; --line:#e4e7eb;
  --text:#1b1d1f; --text-mid:#6b7280; --text-dim:#a3a9b0;
  --accent:#14b8a6; --accent-dim:rgba(20,184,166,.08);
  --star:#f5a623; --star-empty:#e4e7eb;
  --card-w:150px; --card-h:225px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Outfit','Noto Sans KR',sans-serif;font-weight:300;min-height:100vh}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--line)}

header{position:fixed;top:0;left:0;right:0;z-index:200;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:3px}
.hdr-r{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--text-mid);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:14px;height:14px}

.stats-bar{margin-top:54px;padding:12px 22px;border-bottom:1px solid var(--line);display:flex;gap:0;overflow-x:auto}
.stat-item{padding:0 16px;border-right:1px solid var(--line);white-space:nowrap}
.stat-item:first-child{padding-left:0}
.stat-num{font-family:'DM Serif Display',serif;font-size:22px}
.stat-lbl{font-size:9px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase}

.search-bar{padding:10px 22px;border-bottom:1px solid var(--line)}
.search-main{width:100%;max-width:560px;margin:0 auto;display:block;padding:9px 12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-family:inherit;outline:none;color:var(--text)}
.search-main:focus{border-color:var(--accent)}

.controls{padding:10px 22px;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto}
.filter-btn{padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--text-mid);font-size:11px;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.grid{padding:24px 22px 80px;display:flex;flex-wrap:wrap;gap:16px}
.card-wrapper{width:var(--card-w);cursor:pointer}
.card-inner{width:100%;height:var(--card-h);position:relative;transform-style:preserve-3d;transition:transform .6s}
.card-wrapper.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line)}
.card-front{background:var(--surface)}
.card-front img{width:100%;height:100%;object-fit:cover;display:block}
.no-cover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);text-align:center;padding:10px}
.status-tag{position:absolute;top:0;left:0;background:var(--bg);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;font-size:9px;letter-spacing:.5px}
.card-back{transform:rotateY(180deg);background:var(--bg);display:flex;flex-direction:column;padding:11px}
.cb-title{font-family:'DM Serif Display',serif;font-size:12px;line-height:1.3;margin-bottom:3px}
.cb-author{font-size:10px;color:var(--text-mid)}
.cb-divider{height:1px;background:var(--line);margin:8px 0}
.cb-review{flex:1;font-size:10px;color:var(--text-mid);line-height:1.6;overflow:hidden;white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical}
.cb-more{font-size:9px;color:var(--accent);cursor:pointer;margin-top:2px;display:none}
.cb-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.cb-actions{display:flex;gap:2px}
.card-act{width:22px;height:22px;border:1px solid var(--line);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.card-act:hover{border-color:var(--accent);color:var(--accent)}
.card-act svg{width:10px;height:10px}

.view-modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;padding:20px}
.view-modal-overlay.open{opacity:1;pointer-events:all}
.view-modal{background:var(--bg);border:1px solid var(--line);border-radius:0;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;padding:20px}
.view-modal-hdr{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.view-modal-hdr img{width:48px;height:68px;object-fit:cover;flex-shrink:0}
.view-modal-title{font-family:'DM Serif Display',serif;font-size:15px}
.view-modal-meta{font-size:11px;color:var(--text-dim);margin-top:4px}
.view-modal-close{margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px}
.view-modal-review{font-size:12px;color:var(--text-mid);line-height:1.8;white-space:pre-wrap;word-wrap:break-word;max-height:38vh;overflow-y:auto}
.view-modal-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.view-modal-actions{display:flex;gap:6px}

.cap-choice-overlay{position:fixed;inset:0;z-index:410;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.cap-choice-overlay.open{opacity:1;pointer-events:all}
.cap-choice{background:var(--bg);border:1px solid var(--line);padding:18px;width:200px;text-align:center}
.cap-choice-title{font-size:11px;color:var(--text-dim);margin-bottom:12px}
.cap-choice button{width:100%;padding:9px;margin-bottom:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:12px}
.cap-choice button:hover{border-color:var(--accent);color:var(--accent)}

.add-card{width:var(--card-w);height:var(--card-h);border:1px dashed var(--line);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.add-card:hover{border-color:var(--accent);color:var(--accent)}
.empty-state{width:100%;text-align:center;padding:60px 20px;color:var(--text-dim);font-size:11px;letter-spacing:1px}

.stars{display:flex;gap:1px}
.star-item{position:relative;width:12px;height:12px;color:var(--star-empty)}
.star-item svg{position:absolute;inset:0}
.star-fill{overflow:hidden;color:var(--star)}

.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(20,20,20,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
@media(min-width:600px){.modal-overlay{align-items:center;padding:20px}}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg);border:1px solid var(--line);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:24px 22px 28px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-family:'DM Serif Display',serif;font-size:15px;letter-spacing:1px}

.srch-input{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
.srch-input:focus{border-color:var(--accent)}
.srch-results{display:flex;flex-direction:column;gap:6px}
.srch-item{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);cursor:pointer}
.srch-item:hover{border-color:var(--accent);background:var(--accent-dim)}
.srch-cover{width:32px;height:48px;object-fit:cover;background:var(--surface);flex-shrink:0}
.srch-title{font-size:13px;font-weight:500}
.srch-meta{font-size:10px;color:var(--text-dim);margin-top:2px}
.searching{text-align:center;padding:16px;color:var(--text-dim);font-size:11px}

.sel-chip{display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.sel-chip img{width:40px;height:60px;object-fit:cover;background:var(--line);flex-shrink:0}
.sel-title{font-size:14px;font-weight:500;margin-bottom:3px}
.sel-meta{font-size:10px;color:var(--text-dim);line-height:1.5}

.form-sec{margin-bottom:16px}
.form-lbl{display:block;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px}
.form-ta{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-family:inherit;outline:none;resize:none;line-height:1.6}
.form-ta:focus{border-color:var(--accent)}

.star-inp{display:flex;gap:4px}
.star-inp .star-item{width:26px;height:26px;cursor:pointer}

.status-grp{display:flex;gap:6px}
.status-opt{flex:1;padding:8px 4px;border:1px solid var(--line);background:transparent;color:var(--text-mid);font-size:11px;font-family:inherit;cursor:pointer;text-align:center}
.status-opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.save-btn{width:100%;padding:11px;border:1px solid var(--text);background:var(--text);color:#fff;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-family:inherit;cursor:pointer;margin-top:4px}
.save-btn:hover{opacity:.85}

.cap-wrap{position:fixed;top:-9999px;left:-9999px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--text);color:#fff;border-radius:2px;padding:9px 20px;font-size:11px;z-index:999;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
#sync-icon{transition:transform .3s}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="logo">SHELF</div>
  <div class="hdr-r">
    <button class="icon-btn" id="syncBtn" title="지금 바로 동기화"><span id="sync-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span></button>
    <button class="icon-btn" id="openAddBtn" title="책 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  </div>
</header>


<div class="stats-bar">
  <div class="stat-item"><span class="stat-num" id="sTotal">0</span><span class="stat-lbl">Total</span></div>
  <div class="stat-item"><span class="stat-num" id="sDone">0</span><span class="stat-lbl">Read</span></div>
  <div class="stat-item"><span class="stat-num" id="sReading">0</span><span class="stat-lbl">Reading</span></div>
  <div class="stat-item"><span class="stat-num" id="sPlan">0</span><span class="stat-lbl">Plan</span></div>
  <div class="stat-item"><span class="stat-num" id="sAvg">—</span><span class="stat-lbl">Avg ★</span></div>
</div>

<div class="search-bar"><input class="search-main" id="mainSearch" placeholder="내 서재 검색..."></div>

<div class="controls">
  <button class="filter-btn active" data-filter="all">전체</button>
  <button class="filter-btn" data-filter="읽음">읽음</button>
  <button class="filter-btn" data-filter="읽는 중">읽는 중</button>
  <button class="filter-btn" data-filter="읽고 싶음">읽고 싶음</button>
</div>
<div class="controls">
  <button class="filter-btn sort-btn active" data-sort="newest">최신순</button>
  <button class="filter-btn sort-btn" data-sort="oldest">오래된순</button>
  <button class="filter-btn sort-btn" data-sort="rating_high">별점 높은순</button>
  <button class="filter-btn sort-btn" data-sort="rating_low">별점 낮은순</button>
</div>

<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<div class="cap-wrap" id="capWrap"></div>

<div class="view-modal-overlay" id="viewModalOverlay">
  <div class="view-modal" id="viewModalBody"></div>
</div>
<div class="cap-choice-overlay" id="capChoiceOverlay">
  <div class="cap-choice">
    <div class="cap-choice-title">어떻게 저장할까요?</div>
    <button data-choice="front">앞면만</button>
    <button data-choice="back">뒷면만</button>
    <button data-choice="both">둘 다 (나란히)</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modalTitle">NEW</span>
      <button class="icon-btn" id="closeModalBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div id="searchSection">
      <input class="srch-input" id="searchInput" placeholder="책 제목으로 검색...">
      <div class="srch-results" id="srchResults"></div>
    </div>
    <div id="selectedSection" style="display:none">
      <div class="sel-chip" id="selChip"></div>
      <div class="form-sec">
        <label class="form-lbl">상태</label>
        <div class="status-grp">
          <button class="status-opt" data-status="읽고 싶음">읽고 싶음</button>
          <button class="status-opt" data-status="읽는 중">읽는 중</button>
          <button class="status-opt" data-status="읽음">읽음</button>
        </div>
      </div>
      <div class="form-sec">
        <label class="form-lbl">별점</label>
        <div class="star-inp" id="starInp"></div>
      </div>
      <div class="form-sec">
        <label class="form-lbl">소감</label>
        <textarea class="form-ta" id="reviewInput" rows="4" placeholder="이 책에 대한 생각을 남겨보세요..."></textarea>
      </div>
      <button class="save-btn" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<script>
/* ════ CONFIG ════ */
const STATUS_LIST = ['읽고 싶음', '읽는 중', '읽음'];

/* ════ STATE ════ */
let records = JSON.parse(localStorage.getItem('shelf_v1') || '[]');
records.forEach(r => { if (!r.updatedAt) r.updatedAt = r.addedAt || Date.now(); });
let flt = 'all', book = null, rating = 0, curStatus = '읽음', searchQuery = '', srt = 'newest';

function save() { localStorage.setItem('shelf_v1', JSON.stringify(records)); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

/* ════════════════════════════════════════
   ★ 별점 — REEL보다 훨씬 안정적인 방식.
   별 하나(넓은 클릭 영역)에서 클릭한 x좌표가 왼쪽 절반이면 반개, 오른쪽 절반이면 한 개로 계산.
   버튼을 10개씩 쪼개던 예전 방식보다 오작동이 훨씬 적어요.
════════════════════════════════════════ */
function starSVG(fillPct) {
  return `<svg viewBox="0 0 24 24"><defs><clipPath id="c${Math.random().toString(36).slice(2)}"><rect x="0" y="0" width="${24 * fillPct / 100}" height="24"/></clipPath></defs>
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;
}
function renderStarsDisplay(r) {
  r = r || 0;
  let html = '<div class="stars">';
  for (let i = 1; i <= 5; i++) {
    const pct = Math.max(0, Math.min(100, (r - (i - 1)) * 100));
    html += `<span class="star-item">
      <svg viewBox="0 0 24 24" style="position:absolute;inset:0;color:var(--star-empty)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/></svg>
      <span class="star-fill" style="position:absolute;inset:0;width:${pct}%"><svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/></svg></span>
    </span>`;
  }
  return html + '</div>';
}
function buildStarInput() {
  const c = document.getElementById('starInp');
  c.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const el = document.createElement('span');
    el.className = 'star-item';
    el.dataset.i = i;
    el.innerHTML = `
      <svg viewBox="0 0 24 24" style="position:absolute;inset:0;color:var(--star-empty)"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/></svg>
      <span class="star-fill" style="position:absolute;inset:0;width:0%"><svg viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="currentColor"/></svg></span>`;
    el.addEventListener('click', (e) => {
      const rect = el.getBoundingClientRect();
      const isLeftHalf = (e.clientX - rect.left) < rect.width / 2;
      rating = isLeftHalf ? i - 0.5 : i;
      updateStarInputDisplay();
    });
    c.appendChild(el);
  }
  updateStarInputDisplay();
}
function updateStarInputDisplay() {
  document.querySelectorAll('#starInp .star-item').forEach(el => {
    const i = parseInt(el.dataset.i);
    const pct = Math.max(0, Math.min(100, (rating - (i - 1)) * 100));
    el.querySelector('.star-fill').style.width = pct + '%';
  });
}

/* ════ STATS ════ */
function updateStats() {
  const tot = records.length;
  const done = records.filter(r => r.status === '읽음').length;
  const reading = records.filter(r => r.status === '읽는 중').length;
  const plan = records.filter(r => r.status === '읽고 싶음').length;
  const rated = records.filter(r => r.rating > 0);
  const avg = rated.length ? (rated.reduce((s, r) => s + r.rating, 0) / rated.length).toFixed(1) : '—';
  document.getElementById('sTotal').textContent = tot;
  document.getElementById('sDone').textContent = done;
  document.getElementById('sReading').textContent = reading;
  document.getElementById('sPlan').textContent = plan;
  document.getElementById('sAvg').textContent = avg;
}

/* ════ RENDER GRID ════ */
function getList() {
  let l = [...records];
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    l = l.filter(r => (r.title || '').toLowerCase().includes(q) || (r.author || '').toLowerCase().includes(q));
  }
  if (flt !== 'all') l = l.filter(r => r.status === flt);
  if (srt === 'newest') l.sort((a, b) => b.addedAt - a.addedAt);
  else if (srt === 'oldest') l.sort((a, b) => a.addedAt - b.addedAt);
  else if (srt === 'rating_high') l.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  else if (srt === 'rating_low') l.sort((a, b) => (a.rating || 0) - (b.rating || 0));
  return l;
}
function renderGrid() {
  const g = document.getElementById('grid');
  const list = getList();
  g.innerHTML = '';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-card';
  addBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:20px;height:20px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span style="font-size:9px;letter-spacing:2px">추가</span>`;
  addBtn.onclick = openAdd;
  g.appendChild(addBtn);

  if (!list.length) {
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.textContent = '기록이 없습니다';
    g.appendChild(e);
    updateStats();
    return;
  }

  list.forEach(rec => {
    const w = document.createElement('div');
    w.className = 'card-wrapper';
    w.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">
          ${rec.cover ? `<img src="${rec.cover}" alt="${esc(rec.title)}" loading="lazy">` : `<div class="no-cover">${esc(rec.title)}</div>`}
          <div class="status-tag">${rec.status}</div>
        </div>
        <div class="card-face card-back">
          <div class="cb-title">${esc(rec.title)}</div>
          <div class="cb-author">${esc(rec.author || '')}</div>
          <div class="cb-divider"></div>
          <div class="cb-review" id="review-${rec.id}">${rec.review ? esc(rec.review) : '<span style="opacity:.4">소감 없음</span>'}</div>
          <div class="cb-more" id="more-${rec.id}">...더보기</div>
          <div class="cb-footer">
            ${renderStarsDisplay(rec.rating)}
            <div class="cb-actions">
              <button class="card-act" data-a="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
              <button class="card-act" data-a="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button class="card-act" data-a="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
            </div>
          </div>
        </div>
      </div>`;
    w.querySelector('.card-inner').addEventListener('click', (e) => { if (!e.target.closest('.card-act') && !e.target.closest('.cb-more')) w.classList.toggle('flipped'); });
    w.querySelectorAll('.card-act').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      if (b.dataset.a === 'delete') del(rec.id);
      if (b.dataset.a === 'edit') openEdit(rec.id);
      if (b.dataset.a === 'capture') openCaptureChoice(rec.id);
    }));
    const reviewEl = w.querySelector(`#review-${rec.id}`);
    const moreEl = w.querySelector(`#more-${rec.id}`);
    if (reviewEl && moreEl && rec.review) {
      requestAnimationFrame(() => {
        if (reviewEl.scrollHeight > reviewEl.clientHeight + 2) moreEl.style.display = 'block';
      });
      moreEl.addEventListener('click', (e) => { e.stopPropagation(); openReviewPopup(rec.id); });
    }
    g.appendChild(w);
  });
  updateStats();
}

/* ════ DELETE ════ */
function del(id) {
  if (!confirm('삭제할까요?')) return;
  const rec = records.find(r => r.id === id);
  records = records.filter(r => r.id !== id);
  save(); renderGrid(); toast('삭제되었습니다');
  if (rec && rec.notionPageId) autoDeleteBook(rec.notionPageId);
}

/* ════ CAPTURE ════ */
async function renderBackCanvasBook(rec) {
  const cap = document.getElementById('capWrap');
  cap.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
  const fillColor = '#f5a623', emptyColor = '#e4e7eb';
  let capStars = '';
  const rt = rec.rating || 0;
  for (let i = 1; i <= 5; i++) {
    if (i <= rt) capStars += `<span style="position:relative;display:inline-block;color:${emptyColor};font-size:16px;"><span style="position:absolute;top:0;left:0;width:100%;overflow:hidden;color:${fillColor};">★</span>☆</span>`;
    else if (i - 0.5 === rt) capStars += `<span style="position:relative;display:inline-block;color:${emptyColor};font-size:16px;"><span style="position:absolute;top:0;left:0;width:50%;overflow:hidden;color:${fillColor};">★</span>☆</span>`;
    else capStars += `<span style="color:${emptyColor};font-size:16px;">☆</span>`;
  }
  cap.innerHTML = `
  <div style="width:380px;height:560px;padding:30px;background:#fff;font-family:sans-serif;box-sizing:border-box;display:flex;flex-direction:column;">
    <div style="font-size:11px;letter-spacing:4px;color:#999;margin-bottom:20px;">SHELF</div>
    <div style="display:flex;gap:16px;margin-bottom:16px;">
      ${rec.cover ? `<img src="${rec.cover}" crossorigin="anonymous" style="width:70px;height:105px;object-fit:cover;">` : ''}
      <div><div style="font-size:17px;margin-bottom:4px;">${esc(rec.title)}</div><div style="font-size:12px;color:#888;">${esc(rec.author || '')}</div></div>
    </div>
    <div style="height:1px;background:#eee;margin-bottom:14px;"></div>
    <div id="capReviewTextBook" style="font-size:14px;color:#555;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;flex:1;overflow:hidden;">${rec.review ? esc(rec.review) : '소감 없음'}</div>
    <div style="margin-top:auto;padding-top:14px;display:flex;gap:2px;">${capStars}</div>
  </div>`;
  await new Promise(r => setTimeout(r, 250));
  const reviewElBook = cap.querySelector('#capReviewTextBook');
  if (reviewElBook) {
    let fs = 14;
    while (reviewElBook.scrollHeight > reviewElBook.clientHeight + 2 && fs > 8) {
      fs -= 1;
      reviewElBook.style.fontSize = fs + 'px';
    }
  }
  const cv = await html2canvas(cap.firstElementChild, { scale: 2, backgroundColor: '#fff', useCORS: true, allowTaint: true });
  cap.innerHTML = '';
  return cv;
}
async function renderFrontCanvasBook(rec) {
  const cap = document.getElementById('capWrap');
  cap.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
  cap.innerHTML = `
  <div style="width:380px;height:560px;position:relative;overflow:hidden;background:#f6f7f8;font-family:sans-serif;">
    ${rec.cover ? `<img src="${rec.cover}" crossorigin="anonymous" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:15px;">${esc(rec.title)}</div>`}
    <div style="position:absolute;left:0;right:0;bottom:0;padding:20px;background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0));">
      <div style="font-size:16px;color:#fff;font-weight:600;">${esc(rec.title)}</div>
    </div>
  </div>`;
  await new Promise(r => setTimeout(r, 250));
  const cv = await html2canvas(cap.firstElementChild, { scale: 2, backgroundColor: '#f6f7f8', useCORS: true, allowTaint: true });
  cap.innerHTML = '';
  return cv;
}
function downloadCanvasBook(cv, filename) {
  const a = document.createElement('a');
  a.download = filename; a.href = cv.toDataURL('image/png'); a.click();
}
async function doCaptureBook(id, choice) {
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  toast('이미지 저장 중...');
  try {
    if (choice === 'front') {
      downloadCanvasBook(await renderFrontCanvasBook(rec), `${rec.title}_shelf_front.png`);
    } else if (choice === 'back') {
      downloadCanvasBook(await renderBackCanvasBook(rec), `${rec.title}_shelf_back.png`);
    } else {
      const front = await renderFrontCanvasBook(rec);
      const back = await renderBackCanvasBook(rec);
      const combined = document.createElement('canvas');
      combined.width = front.width + back.width;
      combined.height = Math.max(front.height, back.height);
      const ctx = combined.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, combined.width, combined.height);
      ctx.drawImage(front, 0, 0);
      ctx.drawImage(back, front.width, 0);
      downloadCanvasBook(combined, `${rec.title}_shelf_both.png`);
    }
    toast('저장되었습니다');
  } catch (e) { toast('저장 실패'); }
}
let captureTargetIdBook = null;
function openCaptureChoice(id) {
  captureTargetIdBook = id;
  document.getElementById('capChoiceOverlay').classList.add('open');
}
function closeCaptureChoice() { document.getElementById('capChoiceOverlay').classList.remove('open'); }
document.querySelectorAll('.cap-choice button').forEach(b => {
  b.addEventListener('click', () => {
    const choice = b.dataset.choice;
    closeCaptureChoice();
    if (captureTargetIdBook) doCaptureBook(captureTargetIdBook, choice);
  });
});
document.getElementById('capChoiceOverlay').addEventListener('click', (e) => { if (e.target.id === 'capChoiceOverlay') closeCaptureChoice(); });

/* ════ REVIEW VIEW POPUP ════ */

  if (!rec) return;
  document.getElementById('viewModalBody').innerHTML = `
    <div class="view-modal-hdr">
      ${rec.cover ? `<img src="${rec.cover}">` : ''}
      <div style="min-width:0;flex:1">
        <div class="view-modal-title">${esc(rec.title)}</div>
        <div class="view-modal-meta">${esc(rec.author || '')}</div>
      </div>
      <button class="view-modal-close" id="viewModalClose">✕</button>
    </div>
    <div class="view-modal-review">${rec.review ? esc(rec.review) : '<span style="opacity:.4">소감 없음</span>'}</div>
    <div class="view-modal-footer">
      ${renderStarsDisplay(rec.rating)}
      <div class="view-modal-actions">
        <button class="card-act" data-a="capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
        <button class="card-act" data-a="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="card-act" data-a="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>
      </div>
    </div>
  `;
  document.getElementById('viewModalOverlay').classList.add('open');
  document.getElementById('viewModalClose').addEventListener('click', closeReviewPopup);
  document.querySelectorAll('#viewModalBody .card-act').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.a === 'capture') openCaptureChoice(id);
    if (b.dataset.a === 'edit') { closeReviewPopup(); openEdit(id); }
    if (b.dataset.a === 'delete') { closeReviewPopup(); del(id); }
  }));
}
function closeReviewPopup() { document.getElementById('viewModalOverlay').classList.remove('open'); }
document.getElementById('viewModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'viewModalOverlay') closeReviewPopup(); });

/* ════ MODAL ════ */
function openAdd() {
  book = null; rating = 0; curStatus = '읽음';
  document.getElementById('modalTitle').textContent = 'NEW';
  document.getElementById('searchInput').value = '';
  document.getElementById('srchResults').innerHTML = '';
  document.getElementById('searchSection').style.display = '';
  document.getElementById('selectedSection').style.display = 'none';
  document.getElementById('reviewInput').value = '';
  window._editId = null;
  setStatus('읽음'); buildStarInput();
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('searchInput').focus(), 200);
}
function openEdit(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  window._editId = id;
  rating = r.rating || 0; curStatus = r.status;
  book = { title: r.title, author: r.author, publisher: r.publisher, cover: r.cover, isbn: r.isbn };
  document.getElementById('modalTitle').textContent = 'EDIT';
  document.getElementById('searchSection').style.display = 'none';
  showChip(r);
  setStatus(curStatus); buildStarInput();
  document.getElementById('reviewInput').value = r.review || '';
  document.getElementById('selectedSection').style.display = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('closeModalBtn').onclick = closeModal;
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });

function setStatus(s) {
  curStatus = s;
  document.querySelectorAll('.status-opt').forEach(b => b.classList.toggle('active', b.dataset.status === s));
}
document.querySelectorAll('.status-opt').forEach(b => b.addEventListener('click', () => setStatus(b.dataset.status)));

/* ════ SEARCH (Google Books) ════ */
let srchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(srchTimer);
  const q = e.target.value.trim();
  if (!q) { document.getElementById('srchResults').innerHTML = ''; return; }
  srchTimer = setTimeout(() => doSearch(q), 450);
});
async function doSearch(q) {
  const res = document.getElementById('srchResults');
  res.innerHTML = `<div class="searching">검색 중...</div>`;
  try {
    const r = await fetch(`/api/books?q=${encodeURIComponent(q)}`);
    const d = await r.json();
    if (!r.ok) { res.innerHTML = `<div class="searching">${esc(d.error || '검색 실패')}</div>`; return; }
    const items = d.items || [];
    if (!items.length) { res.innerHTML = `<div class="searching">결과 없음</div>`; return; }
    res.innerHTML = '';
    items.forEach(info => {
      const cover = info.thumbnail || '';
      const el = document.createElement('div');
      el.className = 'srch-item';
      el.innerHTML = `
        ${cover ? `<img class="srch-cover" src="${cover}">` : `<div class="srch-cover"></div>`}
        <div><div class="srch-title">${esc(info.title || '제목 없음')}</div><div class="srch-meta">${esc((info.authors || []).join(', '))}${info.publisher ? ' · ' + esc(info.publisher) : ''}</div></div>`;
      el.onclick = () => pickBook(info);
      res.appendChild(el);
    });
  } catch (err) { res.innerHTML = `<div class="searching">검색 실패</div>`; }
}
function pickBook(info) {
  book = {
    title: info.title || '제목 없음',
    author: (info.authors || []).join(', '),
    publisher: info.publisher || '',
    cover: info.cover || info.thumbnail || '',
    isbn: info.isbn || ''
  };
  document.getElementById('searchSection').style.display = 'none';
  showChip(book);
  document.getElementById('selectedSection').style.display = '';
}
function showChip(b) {
  document.getElementById('selChip').innerHTML = `
    ${b.cover ? `<img src="${b.cover}">` : ''}
    <div><div class="sel-title">${esc(b.title)}</div><div class="sel-meta">${esc(b.author || '')}${b.publisher ? ' · ' + esc(b.publisher) : ''}</div></div>`;
}

/* ════ SAVE ════ */
document.getElementById('saveBtn').onclick = () => {
  if (!book) { toast('책을 선택해주세요'); return; }
  const review = document.getElementById('reviewInput').value.trim();
  let rec;
  if (window._editId) {
    const i = records.findIndex(r => r.id === window._editId);
    records[i] = { ...records[i], rating, status: curStatus, review, updatedAt: Date.now() };
    rec = records[i];
  } else {
    rec = {
      id: Date.now().toString(), title: book.title, author: book.author, publisher: book.publisher,
      cover: book.cover, isbn: book.isbn, rating, status: curStatus, review,
      addedAt: Date.now(), updatedAt: Date.now(), notionPageId: null
    };
    records.unshift(rec);
  }
  save(); renderGrid(); closeModal();
  toast('저장되었습니다');
  autoPushBook(rec);
};

/* ════ FILTER / SEARCH BAR ════ */
document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.filter-btn[data-filter]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); flt = b.dataset.filter; renderGrid();
}));
document.querySelectorAll('.sort-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.sort-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); srt = b.dataset.sort; renderGrid();
}));
document.getElementById('mainSearch').addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderGrid(); });
document.getElementById('openAddBtn').onclick = openAdd;

/* ════════════════════════════════════════
   NOTION SYNC — Daily/REEL과 같은 공용 프록시(/api/notion?app=book) 사용
════════════════════════════════════════ */
const NOTION_ENDPOINT = '/api/notion?app=book';
let syncCount = 0;
function setSyncSpin(on) {
  syncCount = Math.max(0, syncCount + (on ? 1 : -1));
  document.getElementById('sync-icon').style.animation = syncCount > 0 ? 'spin 1s linear infinite' : '';
}
function bookPayload(rec) {
  return {
    appId: rec.id, notionPageId: rec.notionPageId || null,
    name: rec.title, author: rec.author, publisher: rec.publisher, cover: rec.cover, isbn: rec.isbn,
    rating: rec.rating || 0, status: rec.status, review: rec.review || '',
    updatedAt: new Date(rec.updatedAt || rec.addedAt || Date.now()).toISOString()
  };
}
async function autoPushBook(rec) {
  setSyncSpin(true);
  try {
    const r = await fetch(NOTION_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: [bookPayload(rec)] }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '업로드 실패');
    const result = (data.results || [])[0];
    if (result && result.notionPageId) { rec.notionPageId = result.notionPageId; save(); }
  } catch (err) { console.warn('노션 동기화 실패(조용히 재시도됨):', err.message); }
  finally { setSyncSpin(false); }
}
async function autoDeleteBook(pageId) {
  setSyncSpin(true);
  try { await fetch(NOTION_ENDPOINT, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pageId }) }); }
  catch (err) { console.warn('노션 삭제 실패:', err.message); }
  finally { setSyncSpin(false); }
}

// 노션 쪽에 새로 생기거나 더 최근에 수정된 항목을 로컬로 가져온다 (노션→앱 방향).
async function pullFromNotion() {
  const r = await fetch(NOTION_ENDPOINT);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '다운로드 실패');

  const localById = {};
  records.forEach(rec => { localById[rec.id] = rec; });
  let changed = false;

  (data.items || []).forEach(row => {
    if (!row.appId) return;
    const remoteTime = row.lastUpdated ? new Date(row.lastUpdated).getTime() : 0;
    const existing = localById[row.appId];
    if (existing) {
      if (remoteTime > (existing.updatedAt || 0)) {
        existing.title = row.name; existing.author = row.author; existing.publisher = row.publisher;
        existing.isbn = row.isbn; existing.rating = row.rating || 0; existing.status = row.status || existing.status;
        existing.review = row.review || ''; existing.cover = row.cover || existing.cover;
        existing.notionPageId = row.notionPageId; existing.updatedAt = remoteTime;
        changed = true;
      }
    } else {
      records.unshift({
        id: row.appId, title: row.name, author: row.author, publisher: row.publisher,
        cover: row.cover || null, isbn: row.isbn, rating: row.rating || 0, status: row.status || '읽음', review: row.review || '',
        addedAt: remoteTime || Date.now(), updatedAt: remoteTime || Date.now(), notionPageId: row.notionPageId
      });
      changed = true;
    }
  });

  if (changed) { save(); renderGrid(); }
}

document.getElementById('syncBtn').onclick = async () => {
  if (!records.length) { toast('동기화할 기록이 없어요'); return; }
  toast('전체 동기화 중...');
  for (const rec of records) await autoPushBook(rec);
  try { await pullFromNotion(); } catch (err) { console.warn('pull 실패:', err.message); }
  toast('동기화 완료');
};

/* ════ INIT ════ */
renderGrid();
pullFromNotion().catch(err => console.warn('초기 pull 실패:', err.message));
setInterval(() => { pullFromNotion().catch(err => console.warn('백그라운드 pull 실패:', err.message)); }, 30000);
</script>
