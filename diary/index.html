<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>✩°｡⋆ diary ⋆｡°✩</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'%3E%3Crect x='1' y='0' width='2' height='1' fill='%23ff6fa8'/%3E%3Crect x='4' y='0' width='2' height='1' fill='%23ff6fa8'/%3E%3Crect x='0' y='1' width='7' height='2' fill='%23ff6fa8'/%3E%3Crect x='1' y='3' width='5' height='1' fill='%23ff6fa8'/%3E%3Crect x='2' y='4' width='3' height='1' fill='%23ff6fa8'/%3E%3Crect x='3' y='5' width='1' height='1' fill='%23ff6fa8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css">
<style>
:root{
  --pink:#ffc6de; --pink-deep:#ff9ec7;
  --purple:#d9c7fb; --purple-deep:#b79bf5;
  --blue:#c2e0ff; --blue-deep:#93c8ff;
  --yellow:#fff2a8; --yellow-deep:#ffe066;
  --bg:#fff8fc; --card:#ffffff; --ink:#4a3b52; --ink-soft:#9a8aa3;
  --border:#f0d9ec;
  --radius:18px;
  --font: 'Mona12', sans-serif;
  --pixel-clip-6: polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px),0 6px,6px 6px);
  --pixel-clip-4: polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:radial-gradient(var(--pink) 1.4px, transparent 1.4px);
  background-size:22px 22px;
  color:var(--ink);
  min-height:100vh;
  padding-bottom:60px;
}
button,input,textarea{font-family:var(--font)}
.wrap{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top, 0px) + 24px) 16px 20px}

/* HEADER */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.app-title{font-size:16px;color:var(--purple-deep);display:flex;align-items:center;gap:6px;white-space:nowrap}
.btn-add{background:var(--yellow-deep);border:3px solid var(--ink);border-radius:0;padding:9px 16px;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 var(--ink), inset -3px -3px 0 rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.65);color:var(--ink);clip-path:var(--pixel-clip-6)}
.btn-add:active{box-shadow:1px 1px 0 var(--ink), inset -3px -3px 0 rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.65);transform:translate(2px,2px)}
.icon-btn{background:var(--card);border:2px solid var(--border);border-radius:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;clip-path:var(--pixel-clip-4)}

/* LIST */
.entry-row{background:var(--card);border:2.5px solid var(--border);border-radius:0;clip-path:var(--pixel-clip-6);padding:12px 14px;margin-bottom:4px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .1s,border-color .15s;position:relative}
.entry-row:hover{border-color:var(--purple-deep);transform:translateY(-2px)}
.entry-no{font-size:11px;color:var(--ink-soft);width:22px;flex-shrink:0}
.entry-date{background:var(--blue);border-radius:0;clip-path:var(--pixel-clip-4);padding:6px 8px;font-size:11px;text-align:center;flex-shrink:0;min-width:44px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.15), inset 2px 2px 0 rgba(255,255,255,.6)}
.entry-title{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.entry-pics{display:flex;gap:4px;flex-shrink:0}
.pic-thumb{width:30px;height:30px;border-radius:0;object-fit:cover}
.pic-placeholder{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--border)}
.pic-more{width:30px;height:30px;border-radius:8px;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid var(--border)}
.btn-edit-row{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:0;clip-path:var(--pixel-clip-4);background:var(--yellow-deep);border:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.15), inset 2px 2px 0 rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
.entry-row:hover .btn-edit-row{display:flex}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13px}

/* SCREENS */
.screen{display:none}
.screen.active{display:block}

/* VIEW */
.view-card{background:#fff;border:2px solid var(--ink);clip-path:var(--pixel-clip-6);padding:18px}
.view-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.view-date-badge{background:var(--pink);border:2px solid var(--ink);clip-path:var(--pixel-clip-4);width:54px;height:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.view-day{font-size:19px;font-weight:bold;line-height:1}
.view-month{font-size:8px;letter-spacing:1px;margin-top:3px}
.view-title{font-size:15px;display:flex;align-items:center;gap:6px}
.view-block-text{font-size:13px;line-height:1.85;white-space:pre-wrap;margin-bottom:12px;border-radius:6px;transition:background .15s}
.view-block-text.schedule{font-size:9.1px;line-height:1.7}
.view-block-text[style*="background"]{padding:4px 8px}
.view-block-photo{width:100%;display:block;margin-bottom:12px}
.view-actions{display:flex;gap:8px;margin-top:16px}
.btn-pill{flex:1;padding:12px;border-radius:0;border:2.5px solid var(--ink);font-size:13px;cursor:pointer;background:var(--card);clip-path:var(--pixel-clip-6)}
.btn-pill.primary{background:var(--pink-deep);box-shadow:3px 3px 0 var(--ink), inset -3px -3px 0 rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.65)}
.btn-pill.primary:active{box-shadow:1px 1px 0 var(--ink), inset -3px -3px 0 rgba(0,0,0,.15), inset 3px 3px 0 rgba(255,255,255,.65);transform:translate(2px,2px)}

/* EDIT */
.field-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.field-label{background:var(--purple);border-radius:10px;padding:8px 12px;font-size:12px;flex-shrink:0;min-width:60px;text-align:center}
.field-label{background:var(--purple);border:2.5px solid var(--ink);border-radius:0;padding:8px 12px;font-size:12px;flex-shrink:0;min-width:60px;text-align:center;box-shadow:3px 3px 0 var(--ink), inset -2px -2px 0 rgba(0,0,0,.15), inset 2px 2px 0 rgba(255,255,255,.65);clip-path:var(--pixel-clip-4)}
.field-input{flex:1;padding:12px 14px;border:2.5px solid var(--border);border-radius:0;clip-path:var(--pixel-clip-4);font-size:14px;outline:none;background:var(--card)}
.field-input:focus{border-color:var(--purple-deep)}
.lock-toggle{width:52px;height:28px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink), inset -2px -2px 0 rgba(0,0,0,.15), inset 2px 2px 0 rgba(255,255,255,.6)}
.lock-toggle.on{background:var(--pink-deep)}
.lock-toggle .knob{position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;border:2px solid var(--ink)}
.lock-toggle.on .knob{left:25px}

.blocks{display:flex;flex-direction:column;gap:3px;margin:14px 0}
.block-text{position:relative}
.block-text textarea{width:100%;border:2.5px solid var(--border);border-radius:14px;padding:10px 60px 10px 12px;font-size:14px;line-height:1.7;resize:none;outline:none;min-height:56px;background:var(--card)}
.block-text.schedule textarea{font-size:10px;min-height:34px;line-height:1.6}
.btn-highlight{position:absolute;top:6px;right:34px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.highlight-swatches{position:absolute;top:32px;right:6px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:6px;display:none;gap:5px;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.highlight-swatches.open{display:flex}
.highlight-swatches .hs{width:20px;height:20px;border-radius:6px;cursor:pointer;border:1.5px solid var(--border)}
.highlight-swatches .hs.none{background:#fff;position:relative}
.highlight-swatches .hs.none::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft)}
.block-text textarea:focus{border-color:var(--blue-deep)}
.block-text .btn-remove-text{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--ink);cursor:pointer;font-size:10px;color:var(--ink)}
.block-photo{position:relative;display:inline-block}
.block-photo img{width:100%;border-radius:14px;border:2.5px solid var(--border);display:block}
.block-photo .btn-remove-photo{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--ink);cursor:pointer;font-size:11px}
.insert-row{display:flex;gap:6px;justify-content:center}
.block-gap{display:flex;gap:4px;justify-content:center;padding:1px 0;opacity:.35;transition:opacity .15s}
.block-gap:hover{opacity:1}
.block-gap button{background:var(--card);border:1.5px dashed var(--ink-soft);border-radius:8px;padding:2px 8px;font-size:10px;cursor:pointer;color:var(--ink-soft)}
.btn-insert{background:var(--yellow);border:2px dashed var(--ink-soft);border-radius:10px;padding:5px 10px;font-size:11px;cursor:pointer;color:var(--ink)}

/* MODAL (PIN) */
.pin-overlay{position:fixed;inset:0;background:rgba(74,59,82,.45);display:none;align-items:center;justify-content:center;z-index:500}
.pin-overlay.open{display:flex}
.pin-box{background:var(--card);border:3px solid var(--ink);border-radius:0;clip-path:var(--pixel-clip-6);padding:26px;width:260px;text-align:center;box-shadow:5px 5px 0 var(--purple-deep)}
.pin-box .emoji{font-size:26px;margin-bottom:6px}
.pin-box p{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.pin-box input{width:100%;padding:12px;border:2.5px solid var(--border);border-radius:0;clip-path:var(--pixel-clip-4);text-align:center;font-size:16px;letter-spacing:4px;outline:none;margin-bottom:10px}
.pin-box .row{display:flex;gap:8px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;z-index:600;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

#sync-icon{transition:transform .3s}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.pixel-row{display:flex;gap:10px;justify-content:center;margin:6px 0 16px;opacity:.9}
.pixel-row svg{image-rendering:pixelated;shape-rendering:crispEdges}
</style>
</head>
<body>

<div class="wrap">
  <!-- LIST SCREEN -->
  <div class="screen active" id="screen-list">
    <div class="app-header">
      <div class="app-title">✩°｡⋆ diary ⋆｡°✩</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="icon-btn" id="btn-sync" title="지금 바로 동기화"><span id="sync-icon">🔄</span></div>
        <button class="btn-add" id="btn-add">+ ADD</button>
      </div>
    </div>
    <div class="pixel-row" id="pixel-deco"></div>
    <div id="entry-list"></div>
  </div>

  <!-- VIEW SCREEN -->
  <div class="screen" id="screen-view">
    <div class="icon-btn" id="btn-back-view" style="margin-bottom:14px">←</div>
    <div class="view-card">
      <div class="view-header">
        <div class="view-date-badge">
          <div class="view-day" id="view-day"></div>
          <div class="view-month" id="view-month"></div>
        </div>
        <div class="view-title" id="view-title"></div>
      </div>
      <div id="view-body"></div>
    </div>
    <div class="view-actions">
      <button class="btn-pill primary" id="btn-goto-edit">✏️ 수정하기</button>
    </div>
  </div>

  <!-- EDIT SCREEN -->
  <div class="screen" id="screen-edit">
    <div class="icon-btn" id="btn-back-edit" style="margin-bottom:14px">←</div>
    <div class="field-row">
      <div class="field-label">TITLE</div>
      <input class="field-input" id="edit-title" placeholder="제목을 적어주세요">
    </div>
    <div class="field-row">
      <div class="field-label">LOCK</div>
      <div class="lock-toggle" id="edit-lock"><div class="knob"></div></div>
      <span style="font-size:11px;color:var(--ink-soft)">비밀글로 설정</span>
    </div>

    <div class="blocks" id="edit-blocks"></div>
    <div class="insert-row">
      <button class="btn-insert" id="btn-insert-text">+ 글 추가</button>
      <button class="btn-insert" id="btn-insert-photo">+ 사진 추가</button>
      <button class="btn-insert" id="btn-insert-schedule">🗓️ 오늘 일정 불러오기</button>
    </div>
    <input type="file" id="photo-file-input" accept="image/*" multiple style="display:none">

    <div class="view-actions">
      <button class="btn-pill primary" id="btn-done">DONE! 🩷</button>
    </div>
  </div>
</div>

<!-- PIN MODAL -->
<div class="pin-overlay" id="pin-overlay">
  <div class="pin-box">
    <div class="emoji">🔒</div>
    <p id="pin-message">비밀번호를 입력해주세요</p>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="row">
      <button class="btn-pill" id="pin-cancel">취소</button>
      <button class="btn-pill primary" id="pin-confirm">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ CONFIG ═══════════ */
const MAX_PHOTOS = 15;
const MAX_LIST_THUMBS = 3;
const CUTE_PLACEHOLDERS = ['🌟','💫','🌠','✨','🍨','🍮','🥞','🍃'];

/* ═══════════ PIXEL ART DECORATIONS ═══════════ */
/* ═══════════ 홈(toisty) 테마 팔레트 — 하이라이트 색 고를 때 씀. 이름은 저장된 선택값과 매칭용, 홈 화면 것과 같은 목록이에요. ═══════════ */
const HOME_PALETTES = [
  { name: '기본', outerBg: '#FDF6E3', menuInactiveBg: '#FFE0EC', menuActiveBg: '#ECE3FF' },
  { name: 'A', outerBg: '#E9F5A9', menuInactiveBg: '#507255', menuActiveBg: '#C8E6A5' },
  { name: 'B', outerBg: '#fefae0', menuInactiveBg: '#ffcad4', menuActiveBg: '#f4acb7' },
  { name: 'C', outerBg: '#bad7f2', menuInactiveBg: '#f2bac9', menuActiveBg: '#f2e2ba' },
  { name: '하늘1', outerBg: '#EAF6FB', menuInactiveBg: '#CFE9F5', menuActiveBg: '#5BB8DB' },
  { name: '하늘2', outerBg: '#EEF5F9', menuInactiveBg: '#D6E8F0', menuActiveBg: '#89B4D4' },
  { name: '하늘3', outerBg: '#E6F7FB', menuInactiveBg: '#BFE6F2', menuActiveBg: '#3AA6C9' },
  { name: '초록1', outerBg: '#EEFAF3', menuInactiveBg: '#D3F0E0', menuActiveBg: '#5BC990' },
  { name: '초록2', outerBg: '#F2F5EE', menuInactiveBg: '#DBE5CF', menuActiveBg: '#8FAE6F' },
  { name: '초록3', outerBg: '#EEF7EE', menuInactiveBg: '#CFE8CF', menuActiveBg: '#6FAE6F' },
  { name: '새1', outerBg: '#EFBDBD', menuInactiveBg: '#A2739E', menuActiveBg: '#7C6699' },
  { name: '새2', outerBg: '#7C86A3', menuInactiveBg: '#D8AC70', menuActiveBg: '#E1CB8E' },
  { name: '새3', outerBg: '#6B4770', menuInactiveBg: '#F0E8B8', menuActiveBg: '#ACCFA3' },
  { name: '새4', outerBg: '#F0BBDA', menuInactiveBg: '#D5E9F4', menuActiveBg: '#E3F6DE' },
  { name: '새5', outerBg: '#586386', menuInactiveBg: '#C2C6F1', menuActiveBg: '#FEF5DB' },
  { name: '새6', outerBg: '#B0B0CD', menuInactiveBg: '#CDDADF', menuActiveBg: '#DEE6D7' }
];
function getCurrentHomePalette() {
  const savedName = localStorage.getItem('toisty_palette');
  return HOME_PALETTES.find(p => p.name === savedName) || HOME_PALETTES[0];
}

const PIXEL_GRIDS = {
  heart:  ['.11.11.','1111111','1111111','.11111.','..111..','...1...'],
  blob:   ['.1111..','111111.','1.11.1.','1111111','.11111.','..111..'],
  cloud:  ['..111..','.11111.','1111111','1111111','.......','.......'],
  flower: ['.1.1.1.','1.1.1.1','.11111.','1111111','.11111.','...1...'],
  sync:   ['.111.','1...1','1...1','1...1','.111.']
};
function pixelIcon(gridName, color, scale) {
  const grid = PIXEL_GRIDS[gridName];
  scale = scale || 5;
  let rects = '';
  grid.forEach((row, y) => {
    [...row].forEach((ch, x) => { if (ch === '1') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`; });
  });
  const w = grid[0].length, h = grid.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w * scale}" height="${h * scale}">${rects}</svg>`;
}
function renderPixelDeco() {
  const el = document.getElementById('pixel-deco');
  if (!el) return;
  el.innerHTML = pixelIcon('heart', '#ff9ec7') + pixelIcon('blob', '#ffe066') + pixelIcon('cloud', '#93c8ff') + pixelIcon('flower', '#b79bf5');
  const syncEl = document.getElementById('sync-icon');
  if (syncEl) syncEl.innerHTML = pixelIcon('sync', 'var(--ink)', 3);
}


let db;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('diary_app_db', 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPut(store, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ═══════════ STATE ═══════════ */
let entries = [];
let currentEntry = null; // being viewed/edited
let editBlocks = [];     // working copy of content blocks while editing
let pendingInsertIndex = null; // "+ 사진" 버튼을 어느 틈에서 눌렀는지 기억해뒀다가 그 자리에 끼워넣음
const generateId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ═══════════ PIN (app-level lock, separate from site password) ═══════════ */
const PIN_KEY = 'diary_lock_pin_hash';
async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function hasPinSet() { return !!localStorage.getItem(PIN_KEY); }
async function setPin(pin) { localStorage.setItem(PIN_KEY, await sha256(pin)); }
async function checkPin(pin) { return hasPinSet() && (await sha256(pin)) === localStorage.getItem(PIN_KEY); }

function askPin({ isSettingNew }) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('pin-overlay');
    const msg = document.getElementById('pin-message');
    const input = document.getElementById('pin-input');
    msg.textContent = isSettingNew ? '잠금에 사용할 비밀번호를 정해주세요' : '비밀번호를 입력해주세요';
    input.value = '';
    overlay.classList.add('open');
    setTimeout(() => input.focus(), 100);

    const cleanup = () => {
      overlay.classList.remove('open');
      document.getElementById('pin-confirm').onclick = null;
      document.getElementById('pin-cancel').onclick = null;
    };
    document.getElementById('pin-confirm').onclick = async () => {
      const val = input.value.trim();
      if (!val) return;
      if (isSettingNew) {
        await setPin(val);
        cleanup();
        resolve(true);
        return;
      }
      const ok = await checkPin(val);
      if (ok) { cleanup(); resolve(true); }
      else { input.value = ''; msg.textContent = '틀렸어요, 다시 입력해주세요'; }
    };
    document.getElementById('pin-cancel').onclick = () => { cleanup(); resolve(false); };
  });
}

/* ═══════════ RENDER: LIST ═══════════ */
function pastelFor(seed) {
  const palette = ['var(--pink)', 'var(--purple)', 'var(--blue)', 'var(--yellow)'];
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) % 997;
  return palette[h % palette.length];
}

async function renderList() {
  entries.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const el = document.getElementById('entry-list');
  if (!entries.length) {
    el.innerHTML = `<div class="empty">${pixelIcon('star','#ffe066',6)}<br>아직 쓴 일기가 없어요 ⋆｡°✩<br>+ADD를 눌러 첫 일기를 남겨보세요</div>`;
    return;
  }
  el.innerHTML = '';
  let no = entries.length;
  for (const entry of entries) {
    const row = document.createElement('div');
    row.className = 'entry-row';
    const photoBlocks = (entry.content || []).filter(b => b.type === 'photo');
    let picsHTML = '';
    if (entry.locked) {
      const count = Math.min(photoBlocks.length, MAX_LIST_THUMBS);
      for (let i = 0; i < count; i++) {
        const emoji = CUTE_PLACEHOLDERS[(entry.id.charCodeAt(i % entry.id.length) + i) % CUTE_PLACEHOLDERS.length];
        picsHTML += `<div class="pic-placeholder" style="background:${pastelFor(entry.id + i)}">${emoji}</div>`;
      }
    } else {
      const shown = photoBlocks.slice(0, MAX_LIST_THUMBS);
      for (const p of shown) {
        const photo = await idbGet('photos', p.photoId);
        if (photo) picsHTML += `<img class="pic-thumb" src="${photo.dataUrl}">`;
      }
      if (photoBlocks.length > MAX_LIST_THUMBS) picsHTML += `<div class="pic-more">+${photoBlocks.length - MAX_LIST_THUMBS}</div>`;
    }

    row.innerHTML = `
      <div class="entry-no">${String(no).padStart(2, '0')}</div>
      <div class="entry-date">${formatDateShort(entry.date)}</div>
      <div class="entry-title">${entry.locked ? '🔒' : ''} ${escapeHtml(entry.title || '(제목 없음)')}</div>
      <div class="entry-pics">${picsHTML}</div>
      <div class="btn-edit-row" data-id="${entry.id}" title="수정">✏️</div>
    `;
    row.onclick = (e) => {
      if (e.target.closest('.btn-edit-row')) return;
      openEntry(entry.id, false);
    };
    row.querySelector('.btn-edit-row').onclick = (e) => { e.stopPropagation(); openEntry(entry.id, true); };
    el.appendChild(row);
    no--;
  }
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]}<br>${d.getDate()}`;
}
function formatDateBadge(dateStr) {
  if (!dateStr) return { day: '--', month: '' };
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return { day: String(d.getDate()).padStart(2, '0'), month: `${months[d.getMonth()]} ${d.getFullYear()}` };
}
function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ═══════════ OPEN ENTRY (view or edit) ═══════════ */
async function openEntry(id, goEdit) {
  const entry = entries.find(e => e.id === id);
  if (!entry) return;
  if (entry.locked) {
    const ok = await askPin({ isSettingNew: false });
    if (!ok) return;
  }
  currentEntry = entry;
  if (goEdit) showEditScreen(entry); else showViewScreen(entry);
}

/* ═══════════ VIEW SCREEN ═══════════ */
async function showViewScreen(entry) {
  const badge = formatDateBadge(entry.date);
  document.getElementById('view-day').textContent = badge.day;
  document.getElementById('view-month').textContent = badge.month;
  document.getElementById('view-title').textContent = (entry.locked ? '🔒 ' : '') + (entry.title || '(제목 없음)');
  const body = document.getElementById('view-body');
  body.innerHTML = '';
  for (const block of entry.content || []) {
    if (block.type === 'text') {
      if (!block.text) continue;
      const p = document.createElement('div');
      p.className = 'view-block-text' + (block.isSchedule ? ' schedule' : '');
      p.textContent = block.text;
      if (block.highlightColor) p.style.background = block.highlightColor;
      body.appendChild(p);
    } else if (block.type === 'photo') {
      const photo = await idbGet('photos', block.photoId);
      if (photo) {
        const img = document.createElement('img');
        img.className = 'view-block-photo';
        img.src = photo.dataUrl;
        body.appendChild(img);
      }
    }
  }
  showScreen('screen-view');
}

/* ═══════════ EDIT SCREEN ═══════════ */
function showEditScreen(entry) {
  document.getElementById('edit-title').value = entry ? (entry.title || '') : '';
  const lockToggle = document.getElementById('edit-lock');
  lockToggle.classList.toggle('on', !!(entry && entry.locked));
  editBlocks = entry ? JSON.parse(JSON.stringify(entry.content || [])) : [{ type: 'text', text: '' }];
  renderEditBlocks();
  showScreen('screen-edit');
}

function renderEditBlocks() {
  const el = document.getElementById('edit-blocks');
  el.innerHTML = '';

  const makeGap = (atIndex) => {
    const gap = document.createElement('div');
    gap.className = 'block-gap';
    gap.innerHTML = `<button data-t="text">+ 글</button><button data-t="photo">+ 사진</button>`;
    gap.querySelector('[data-t="text"]').onclick = () => {
      editBlocks.splice(atIndex, 0, { type: 'text', text: '' });
      renderEditBlocks();
    };
    gap.querySelector('[data-t="photo"]').onclick = () => {
      const photoCount = editBlocks.filter(b => b.type === 'photo').length;
      if (photoCount >= MAX_PHOTOS) { showToast(`사진은 최대 ${MAX_PHOTOS}장까지예요`); return; }
      pendingInsertIndex = atIndex;
      document.getElementById('photo-file-input').click();
    };
    return gap;
  };

  el.appendChild(makeGap(0)); // 맨 위에도 끼워넣을 수 있게

  editBlocks.forEach((block, idx) => {
    const wrap = document.createElement('div');
    if (block.type === 'text') {
      wrap.className = 'block-text' + (block.isSchedule ? ' schedule' : '');
      wrap.style.position = 'relative';
      const palette = getCurrentHomePalette();
      const swatchColors = [palette.outerBg, palette.menuInactiveBg, palette.menuActiveBg];
      wrap.innerHTML = `
        <textarea placeholder="이어서 적어보세요...">${escapeHtml(block.text)}</textarea>
        <button class="btn-highlight" data-idx="${idx}" title="하이라이트">✎</button>
        <button class="btn-remove-text" data-idx="${idx}">✕</button>
        <div class="highlight-swatches" id="hs-${idx}">
          <div class="hs none" data-color=""></div>
          ${swatchColors.map(c => `<div class="hs" data-color="${c}" style="background:${c}"></div>`).join('')}
        </div>`;
      if (block.highlightColor) wrap.querySelector('textarea').style.background = block.highlightColor;
      wrap.querySelector('textarea').addEventListener('input', (e) => { editBlocks[idx].text = e.target.value; });
      wrap.querySelector('.btn-remove-text').onclick = () => { editBlocks.splice(idx, 1); renderEditBlocks(); };
      wrap.querySelector('.btn-highlight').onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.highlight-swatches.open').forEach(s => { if (s.id !== `hs-${idx}`) s.classList.remove('open'); });
        wrap.querySelector('.highlight-swatches').classList.toggle('open');
      };
      wrap.querySelectorAll('.hs').forEach(sw => sw.addEventListener('click', () => {
        editBlocks[idx].highlightColor = sw.dataset.color || null;
        renderEditBlocks();
      }));
    } else if (block.type === 'photo') {
      wrap.className = 'block-photo';
      wrap.innerHTML = `<img src="${block._dataUrl || ''}"><button class="btn-remove-photo" data-idx="${idx}">✕</button>`;
      wrap.querySelector('.btn-remove-photo').onclick = () => { editBlocks.splice(idx, 1); renderEditBlocks(); };
    }
    el.appendChild(wrap);
    el.appendChild(makeGap(idx + 1)); // 이 블록 바로 다음 자리에 끼워넣기
  });
}

document.getElementById('btn-insert-text').onclick = () => {
  editBlocks.push({ type: 'text', text: '' });
  renderEditBlocks();
};
document.getElementById('btn-insert-photo').onclick = () => {
  const photoCount = editBlocks.filter(b => b.type === 'photo').length;
  if (photoCount >= MAX_PHOTOS) { showToast(`사진은 최대 ${MAX_PHOTOS}장까지예요`); return; }
  pendingInsertIndex = null;
  document.getElementById('photo-file-input').click();
};

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
}

document.getElementById('btn-insert-schedule').onclick = async () => {
  showToast('오늘 일정 불러오는 중...');
  try {
    const r = await fetch('/api/notion?app=calendar');
    const d = await r.json();
    if (!r.ok) { showToast(d.error || '불러오기 실패'); return; }
    const todayStr = new Date().toISOString().slice(0, 10);
    const todays = (d.items || [])
      .filter(ev => ev.start && ev.start.slice(0, 10) === todayStr)
      .sort((a, b) => new Date(a.start) - new Date(b.start));

    if (!todays.length) { showToast('오늘 등록된 일정이 없어요'); return; }

    // 하나로 합쳐진 블록이 아니라, 일정 하나마다 따로 블록으로 넣어야
    // 나중에 그 사이사이에 사진이나 글을 끼워넣을 수 있어요.
    todays.forEach(ev => {
      const start = formatTime(ev.start);
      const end = ev.end ? formatTime(ev.end) : '';
      const line = end ? `${start}–${end} ${ev.name}` : `${start} ${ev.name}`;
      editBlocks.push({ type: 'text', text: line, isSchedule: true });
    });
    renderEditBlocks();
    showToast('오늘 일정을 가져왔어요');
  } catch (err) {
    showToast('불러오기 실패');
  }
};
document.getElementById('photo-file-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  let photoCount = editBlocks.filter(b => b.type === 'photo').length;
  let insertAt = pendingInsertIndex !== null ? pendingInsertIndex : editBlocks.length;
  for (const file of files) {
    if (photoCount >= MAX_PHOTOS) { showToast(`사진은 최대 ${MAX_PHOTOS}장까지예요`); break; }
    const dataUrl = await fileToDataUrl(file);
    editBlocks.splice(insertAt, 0, { type: 'photo', photoId: generateId(), _dataUrl: dataUrl, _isNew: true });
    insertAt++;
    photoCount++;
  }
  pendingInsertIndex = null;
  renderEditBlocks();
  e.target.value = '';
});
function fileToDataUrl(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

document.getElementById('edit-lock').onclick = async function () {
  const turningOn = !this.classList.contains('on');
  if (turningOn) {
    const ok = await askPin({ isSettingNew: !hasPinSet() });
    if (!ok) return;
  }
  this.classList.toggle('on', turningOn);
};

document.getElementById('btn-done').onclick = async () => {
  const doneBtn = document.getElementById('btn-done');
  doneBtn.disabled = true;
  try {
    const title = document.getElementById('edit-title').value.trim();
    const locked = document.getElementById('edit-lock').classList.contains('on');

    // 새 사진은 photos 스토어에 저장
    for (const block of editBlocks) {
      if (block.type === 'photo' && block._isNew) {
        await idbPut('photos', { id: block.photoId, dataUrl: block._dataUrl, notionFileUploadId: null });
      }
    }
    const cleanContent = editBlocks.map(b => b.type === 'photo'
      ? { type: 'photo', photoId: b.photoId }
      : { type: 'text', text: b.text || '', isSchedule: !!b.isSchedule, highlightColor: b.highlightColor || null });

    let entry = currentEntry;
    const isNew = !entry;
    if (isNew) {
      entry = { id: generateId(), date: new Date().toISOString().slice(0, 10), notionPageId: null };
      entries.push(entry);
    }
    entry.title = title;
    entry.locked = locked;
    entry.content = cleanContent;
    entry.updatedAt = Date.now();
    await idbPut('entries', entry);

    currentEntry = entry;
    renderList();
    showViewScreen(entry);
    showToast('저장했어요 🩷');
    // 노션 동기화가 끝날 때까지 기다려야, 같은 글을 연달아 저장할 때
    // notionPageId가 아직 안 채워진 상태로 두 번 생성되는 걸 막을 수 있어요.
    await autoPushDiary(entry);
  } finally {
    doneBtn.disabled = false;
  }
};

/* ═══════════ NAVIGATION ═══════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('btn-add').onclick = () => { currentEntry = null; showEditScreen(null); };
document.getElementById('btn-back-view').onclick = () => showScreen('screen-list');
document.getElementById('btn-back-edit').onclick = () => showScreen('screen-list');
document.getElementById('btn-goto-edit').onclick = () => showEditScreen(currentEntry);

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ═══════════ NOTION SYNC ═══════════ */
const NOTION_ENDPOINT = '/api/notion?app=diary';
let syncCount = 0;
function setSyncSpin(active) {
  syncCount = Math.max(0, syncCount + (active ? 1 : -1));
  document.getElementById('sync-icon').style.animation = syncCount > 0 ? 'spin 1s linear infinite' : '';
}

async function uploadPhotoToNotion(photoId) {
  const photo = await idbGet('photos', photoId);
  if (!photo) return null;
  if (photo.notionFileUploadId) return photo.notionFileUploadId;
  const r = await fetch(`${NOTION_ENDPOINT}&action=upload`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dataUrl: photo.dataUrl })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '사진 업로드 실패');
  photo.notionFileUploadId = data.fileUploadId;
  await idbPut('photos', photo);
  return data.fileUploadId;
}

const diaryPushLocks = {};
async function autoPushDiary(entry) {
  // 같은 글이 동시에 두 번 push되면 노션 페이지가 중복 생성될 수 있어서, 진행 중이면 그 작업이 끝나길 기다렸다가 이어서 실행해요.
  if (diaryPushLocks[entry.id]) await diaryPushLocks[entry.id].catch(() => {});
  const task = autoPushDiaryOnce(entry);
  diaryPushLocks[entry.id] = task;
  try {
    await task;
  } finally {
    if (diaryPushLocks[entry.id] === task) delete diaryPushLocks[entry.id];
  }
}

async function autoPushDiaryOnce(entry) {
  setSyncSpin(true);
  try {
    const content = [];
    for (const block of entry.content) {
      if (block.type === 'photo') {
        const fileUploadId = await uploadPhotoToNotion(block.photoId);
        content.push({ type: 'photo', fileUploadId });
      } else {
        content.push({ type: 'text', text: block.text });
      }
    }
    const r = await fetch(NOTION_ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item: {
        appId: entry.id, notionPageId: entry.notionPageId || null,
        name: entry.title, date: entry.date, locked: entry.locked,
        updatedAt: new Date(entry.updatedAt).toISOString(), content
      } })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '동기화 실패');
    if (data.notionPageId) { entry.notionPageId = data.notionPageId; await idbPut('entries', entry); }
  } catch (err) {
    console.warn('노션 동기화 실패(조용히 재시도됨):', err.message);
  } finally {
    setSyncSpin(false);
  }
}

document.getElementById('btn-sync').onclick = async () => {
  if (!entries.length) { showToast('동기화할 일기가 없어요'); return; }
  showToast('전체 동기화 중...');
  for (const entry of entries) await autoPushDiary(entry);
  try { await pullFromNotion(); } catch (err) { console.warn('pull 실패:', err.message); }
  showToast('동기화 완료 🩷');
};

/* ═══════════ PULL (노션 → 앱): 속성 + 본문(사진 포함)을 함께 가져옴 ═══════════ */
function fetchImageAsDataUrl(url) {
  return fetch(url).then(res => res.blob()).then(blob => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  }));
}

async function pullEntryContent(notionPageId) {
  const r = await fetch(`${NOTION_ENDPOINT}&action=content&pageId=${notionPageId}`);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '본문 조회 실패');
  const content = [];
  for (const seg of data.content || []) {
    if (seg.type === 'photo' && seg.url) {
      const dataUrl = await fetchImageAsDataUrl(seg.url);
      const photoId = generateId();
      await idbPut('photos', { id: photoId, dataUrl, notionFileUploadId: null });
      content.push({ type: 'photo', photoId });
    } else {
      content.push({ type: 'text', text: seg.text || '' });
    }
  }
  return content;
}

// 지금 편집 중이거나 PIN 입력 중인 글은 건드리면 안 되니 이번 주기는 건너뛴다.
function isBusyEditing(entry) {
  const editing = document.getElementById('screen-edit').classList.contains('active');
  const pinOpen = document.getElementById('pin-overlay').classList.contains('open');
  return (editing && currentEntry === entry) || pinOpen;
}

async function pullFromNotion() {
  const r = await fetch(NOTION_ENDPOINT);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '다운로드 실패');

  const localById = {};
  entries.forEach(e => { localById[e.id] = e; });
  let changed = false;

  for (const row of (data.items || [])) {
    if (!row.appId) continue;
    const remoteTime = row.lastUpdated ? new Date(row.lastUpdated).getTime() : 0;
    const existing = localById[row.appId];

    if (existing) {
      if (isBusyEditing(existing)) continue;
      if (remoteTime > (existing.updatedAt || 0)) {
        existing.title = row.name;
        existing.date = row.date;
        existing.locked = row.locked;
        existing.notionPageId = row.notionPageId;
        existing.content = await pullEntryContent(row.notionPageId);
        existing.updatedAt = remoteTime;
        await idbPut('entries', existing);
        changed = true;
      }
    } else {
      const newEntry = {
        id: row.appId, title: row.name, date: row.date || new Date().toISOString().slice(0, 10),
        locked: row.locked, notionPageId: row.notionPageId,
        content: await pullEntryContent(row.notionPageId),
        updatedAt: remoteTime || Date.now()
      };
      entries.push(newEntry);
      await idbPut('entries', newEntry);
      changed = true;
    }
  }

  if (changed) renderList();
}

/* ═══════════ INIT ═══════════ */
(async function init() {
  await openDB();
  entries = await idbGetAll('entries');
  renderPixelDeco();
  renderList();
  pullFromNotion().catch(err => console.warn('초기 pull 실패:', err.message));
  setInterval(() => { pullFromNotion().catch(err => console.warn('백그라운드 pull 실패:', err.message)); }, 45000);
})();
</script>
