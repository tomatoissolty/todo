<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>toisty</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Rebecca';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2210-EF@1.0/EF_Rebecca.woff2') format('woff2');
  font-weight: normal;
  font-display: swap;
}
</style>
<style>
:root{
  --outer-bg:#fdf6e3; --card-bg:#ffffff; --ink:#2c2a28; --ink-soft:#8a8580; --line:#fdf6e3;
  --menu-inactive-bg:#ece3ff; --menu-inactive-text:#FFFCF5;
  --menu-active-bg:#ffe0ec; --menu-active-text:#b8517d;
  --border-w:0.5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--outer-bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px;
}
.shell{
  width:100%; max-width:1200px; height:calc(100vh - 32px); max-height:800px;
  background:var(--card-bg); border:var(--border-w) solid var(--line); border-radius:8px;
  display:flex; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.08); position:relative;
}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;border-right:var(--border-w) solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.header-photo-wrap{aspect-ratio:1/1;background:var(--menu-active-bg);overflow:hidden;position:relative}
.header-photo-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.header-photo-wrap:hover img{transform:scale(1.06)}
nav{display:flex;flex-direction:column}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:14px 16px;
  border-bottom:var(--border-w) solid var(--line); cursor:pointer; font-size:13px; font-weight:normal;
  font-family:'Rebecca',sans-serif; letter-spacing:1px;
  background:var(--menu-inactive-bg); color:var(--menu-inactive-text); transition:background .15s,color .15s;
}
.nav-item .no{font-size:10px;color:var(--menu-inactive-text);opacity:.7}
.nav-item.active{background:var(--menu-active-bg);color:var(--menu-active-text)}
.nav-item:hover:not(.active){filter:brightness(.97)}
.sidebar-bottom-space{flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:120px}
.sidebar-random-photo{height:50%;overflow:hidden;position:relative;background:var(--menu-inactive-bg)}
.sidebar-random-photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s,opacity .4s}
.sidebar-random-photo:hover img{transform:scale(1.06)}

/* MAIN */
main{flex:1;position:relative;overflow-y:auto;background:var(--card-bg)}
.pane{position:absolute;inset:0;display:none;overflow-y:auto}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:none;display:block}
.pane .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px}

/* TOISTY (main) PANE */
.toisty-wrap{padding:28px;max-width:760px;margin:0 auto}
.toisty-title{font-family:'Rebecca',sans-serif;font-size:29px;letter-spacing:1.5px;margin-bottom:20px;min-height:1.2em}
.main-photo-box{
  width:100%; aspect-ratio:16/9; background:var(--menu-active-bg); border:var(--border-w) solid var(--line);
  border-radius:6px; overflow:hidden; margin-bottom:24px; cursor:pointer;
  transition:border-color .2s;
}
.main-photo-box:hover{border-color:var(--menu-active-text)}
.main-photo-box img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.main-photo-box:hover img{transform:scale(1.04)}
.main-photo-box .no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px}

.mini-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-card{
  border:var(--border-w) solid var(--line); border-radius:6px; padding:16px;
  transition:border-color .2s, background .2s;
}
.mini-card:hover{border-color:var(--menu-active-text);background:#fbf9ff}
.mini-card-title{font-family:'Rebecca',sans-serif;font-size:14px;letter-spacing:1.2px;color:var(--ink-soft);margin-bottom:10px}
.mini-todo-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-bottom:var(--border-w) solid var(--line)}
.mini-todo-item:last-child{border-bottom:none}
.mini-todo-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.mini-todo-dot.done{background:#8fd19e}
.mini-todo-dot.undone{background:#f0a5c0}
.mini-todo-item.done span{text-decoration:line-through;color:var(--ink-soft)}
.mini-bm-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:var(--border-w) solid var(--line);text-decoration:none;color:var(--ink);transition:color .15s}
.mini-bm-item:last-child{border-bottom:none}
.mini-bm-item:hover{color:var(--menu-active-text)}
.mini-empty{font-size:12px;color:var(--ink-soft);padding:6px 0}

/* GALLERY PANE */
.gallery-wrap{padding:28px}
.gallery-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:20px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}

/* STORAGE */
.storage-wrap{padding:28px;max-width:600px}
.storage-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:20px}
.storage-upload-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.storage-upload-row input[type="text"]{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px}
.storage-upload-row button{padding:9px 16px;border:none;border-radius:8px;background:var(--menu-active-bg);color:var(--menu-active-text);cursor:pointer;font-size:13px}
.storage-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.storage-item-main{flex:1;min-width:0}
.storage-item-name{font-size:13px;font-weight:500}
.storage-item-meta{font-size:11px;color:var(--ink-soft);margin-top:2px}
.storage-item a{font-size:12px;color:var(--menu-active-text);text-decoration:none;flex-shrink:0}
.storage-item .storage-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;flex-shrink:0}
.gallery-item{aspect-ratio:1/1;overflow:hidden;border-radius:4px;cursor:pointer;background:var(--menu-active-bg)}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s,opacity .3s}
.gallery-item:hover img{transform:scale(1.08);opacity:.9}

.gallery-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:500;padding:20px}
.gallery-popup-overlay.open{opacity:1;pointer-events:all}
.gallery-popup{max-width:600px;max-height:85vh;display:flex;flex-direction:column;align-items:center}
.gallery-popup img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:4px}
.gallery-popup-caption{color:#fff;font-size:13px;margin-top:12px;text-align:center;opacity:.85}
.gallery-popup-close{position:absolute;top:20px;right:24px;color:#fff;font-size:20px;cursor:pointer;background:none;border:none}

@media(max-width:700px){
  body{padding:0}
  .shell{max-height:none;height:100vh;border-radius:0;flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto}
  .header-photo-wrap{display:none}
  nav{flex-direction:row}
  .nav-item{border-bottom:none;border-right:var(--border-w) solid var(--line);white-space:nowrap}
  .mini-cards{grid-template-columns:1fr}
}

/* 테마 색상 - 평소엔 안 보이는 작은 트리거 */
.theme-trigger{
  position:absolute; bottom:10px; right:10px; width:10px; height:10px; border-radius:50%;
  background:var(--ink-soft); opacity:.18; cursor:pointer; z-index:50; transition:opacity .2s;
  display:none;
}
.theme-trigger.visible{display:block}
.theme-trigger:hover{opacity:.6}
.theme-panel{
  position:absolute; bottom:26px; right:10px; background:var(--card-bg); border:1px solid var(--line);
  border-radius:8px; padding:10px; display:none; grid-template-columns:repeat(4,1fr); gap:8px; z-index:51;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}
.theme-panel.open{display:grid}
.theme-swatch{
  width:34px; height:34px; border-radius:6px; cursor:pointer; border:2px solid transparent;
  position:relative; overflow:hidden; transition:transform .15s;
}
.theme-swatch:hover{transform:scale(1.08)}
.theme-swatch.selected{border-color:var(--ink)}
.theme-swatch .sw-half{position:absolute; inset:0}
.theme-swatch .sw-active{position:absolute; left:0; right:0; bottom:0; height:50%}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="header-photo-wrap" id="headerPhotoWrap"></div>
    <nav id="navList">
      <div class="nav-item active" data-app="toisty"><span class="no">#1</span> toisty</div>
      <div class="nav-item" data-app="todo"><span class="no">#2</span> TODO</div>
      <div class="nav-item" data-app="diary"><span class="no">#3</span> DIARY</div>
      <div class="nav-item" data-app="movie"><span class="no">#4</span> MOVIES</div>
      <div class="nav-item" data-app="book"><span class="no">#5</span> BOOKS</div>
      <div class="nav-item" data-app="write"><span class="no">#6</span> WRITE</div>
      <div class="nav-item" data-app="bookmark"><span class="no">#7</span> BOOKMARK</div>
      <div class="nav-item" data-app="expense"><span class="no">#8</span> EXPENSE</div>
      <div class="nav-item" data-app="gallery"><span class="no">#9</span> GALLERY</div>
      <div class="nav-item" data-app="storage"><span class="no">#10</span> STORAGE</div>
    </nav>
    <div class="sidebar-bottom-space">
      <div class="sidebar-random-photo" id="sidebarRandomPhoto"></div>
    </div>
  </aside>
  <main id="main"></main>
  <div class="theme-trigger" id="themeTrigger" title="테마 색상"></div>
  <div class="theme-panel" id="themePanel"></div>
</div>

<div class="gallery-popup-overlay" id="galleryPopupOverlay">
  <button class="gallery-popup-close" id="galleryPopupClose">✕</button>
  <div class="gallery-popup">
    <img id="galleryPopupImg" src="">
    <div class="gallery-popup-caption" id="galleryPopupCaption"></div>
  </div>
</div>

<script>
const navItems = document.querySelectorAll('.nav-item');
const main = document.getElementById('main');
const loadedPanes = {};
const IFRAME_APPS = { todo: '/receipt', diary: '/diary', write: '/write', movie: '/movie', book: '/book', bookmark: '/bookmark', expense: '/expense' };

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showTab(appKey) {
  navItems.forEach(t => t.classList.toggle('active', t.dataset.app === appKey));
  Object.values(loadedPanes).forEach(p => p.classList.remove('active'));

  const themeTrigger = document.getElementById('themeTrigger');
  themeTrigger.classList.toggle('visible', appKey === 'toisty' || appKey === 'gallery');
  if (appKey !== 'toisty' && appKey !== 'gallery') document.getElementById('themePanel').classList.remove('open');

  if (appKey === 'toisty') loadRandomSidebarPhoto(); // 홈으로 돌아올 때마다 무작위로 새로 뽑음

  if (loadedPanes[appKey]) { loadedPanes[appKey].classList.add('active'); return; }

  const pane = document.createElement('div');
  pane.className = 'pane active';

  if (appKey === 'toisty') {
    pane.innerHTML = toistyHTML();
    main.appendChild(pane);
    loadedPanes[appKey] = pane;
    loadToistyData(pane);
  } else if (appKey === 'gallery') {
    pane.innerHTML = `<div class="gallery-wrap"><div class="gallery-title">GALLERY</div><div class="gallery-grid" id="galleryGrid"><div class="mini-empty">불러오는 중...</div></div></div>`;
    main.appendChild(pane);
    loadedPanes[appKey] = pane;
    loadGallery();
  } else if (appKey === 'storage') {
    pane.innerHTML = storageHTML();
    main.appendChild(pane);
    loadedPanes[appKey] = pane;
    initStorage();
  } else if (IFRAME_APPS[appKey]) {
    pane.innerHTML = `<div class="loading">불러오는 중...</div><iframe src="${IFRAME_APPS[appKey]}" title="${appKey}"></iframe>`;
    main.appendChild(pane);
    loadedPanes[appKey] = pane;
    const loadingEl = pane.querySelector('.loading');
    loadingEl.style.pointerEvents = 'none'; // 로딩 문구가 떠 있는 동안에도 밑에 있는 iframe은 눌릴 수 있게
    const hideLoading = () => { loadingEl.style.display = 'none'; };
    pane.querySelector('iframe').addEventListener('load', hideLoading);
    setTimeout(hideLoading, 4000); // 사파리 등에서 load 이벤트가 늦게 오거나 안 오는 경우를 대비한 안전장치
  }
}

navItems.forEach(item => item.addEventListener('click', () => showTab(item.dataset.app)));

/* ════ TOISTY (메인) 화면 ════ */
function storageHTML() {
  return `
    <div class="storage-wrap">
      <div class="storage-title">STORAGE</div>
      <div class="storage-upload-row">
        <input type="text" id="storageName" placeholder="파일 이름/설명">
        <input type="text" id="storageMemo" placeholder="메모 (선택)">
        <input type="file" id="storageFileInput" style="display:none">
        <button id="storageUploadBtn">+ 파일 올리기</button>
      </div>
      <div id="storageList"><div class="mini-empty">불러오는 중...</div></div>
    </div>
  `;
}

function initStorage() {
  document.getElementById('storageUploadBtn').addEventListener('click', () => document.getElementById('storageFileInput').click());
  document.getElementById('storageFileInput').addEventListener('change', handleStorageUpload);
  loadStorageList();
}

async function loadStorageList() {
  const el = document.getElementById('storageList');
  try {
    const r = await fetch('/api/notion?app=storage');
    const d = await r.json();
    const items = (d.items || []).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
    if (!items.length) { el.innerHTML = `<div class="mini-empty">아직 저장된 파일이 없어요</div>`; return; }
    el.innerHTML = items.map(it => `
      <div class="storage-item" data-page="${it.notionPageId}">
        <div class="storage-item-main">
          <div class="storage-item-name">${esc(it.name)}</div>
          <div class="storage-item-meta">${it.date || ''}${it.memo ? ' · ' + esc(it.memo) : ''}</div>
        </div>
        ${it.fileUrl ? `<a href="${it.fileUrl}" target="_blank" download>다운로드</a>` : ''}
        <button class="storage-del" data-page="${it.notionPageId}">✕</button>
      </div>
    `).join('');
    el.querySelectorAll('.storage-del').forEach(btn => btn.addEventListener('click', () => deleteStorageItem(btn.dataset.page)));
  } catch (err) { el.innerHTML = `<div class="mini-empty">불러오기 실패</div>`; }
}

async function handleStorageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const nameInput = document.getElementById('storageName');
  const memoInput = document.getElementById('storageMemo');
  const name = nameInput.value.trim() || file.name;
  const memo = memoInput.value.trim();

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const uploadRes = await fetch('/api/notion?app=storage&action=upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dataUrl: reader.result, fileName: file.name })
      });
      const uploadCT = uploadRes.headers.get('content-type') || '';
      if (!uploadCT.includes('application/json')) throw new Error('로그인이 풀린 것 같아요. 페이지를 새로고침해서 비밀번호를 다시 입력해주세요.');
      const uploadData = await uploadRes.json();
      if (!uploadRes.ok) throw new Error(uploadData.error || '업로드 실패');

      const saveRes = await fetch('/api/notion?app=storage', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: [{ name, memo, date: new Date().toISOString().slice(0, 10), fileUploadId: uploadData.fileUploadId, fileName: file.name }]
        })
      });
      if (!saveRes.ok) throw new Error('저장 실패');

      nameInput.value = ''; memoInput.value = ''; e.target.value = '';
      loadStorageList();
    } catch (err) { alert('업로드 실패: ' + err.message); }
  };
  reader.readAsDataURL(file);
}

async function deleteStorageItem(pageId) {
  if (!confirm('이 파일을 삭제할까요?')) return;
  try {
    await fetch('/api/notion?app=storage', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pageId }) });
    loadStorageList();
  } catch (err) { alert('삭제 실패'); }
}

function toistyHTML() {
  return `
    <div class="toisty-wrap">
      <div class="toisty-title" id="toistyTitle"></div>
      <div class="main-photo-box" id="mainPhotoBox"><div class="no-photo">불러오는 중...</div></div>
      <div class="mini-cards">
        <div class="mini-card">
          <div class="mini-card-title">TODO</div>
          <div id="miniTodo"><div class="mini-empty">불러오는 중...</div></div>
        </div>
        <div class="mini-card">
          <div class="mini-card-title">BOOKMARK</div>
          <div id="miniBookmark"><div class="mini-empty">불러오는 중...</div></div>
        </div>
      </div>
    </div>
  `;
}

async function loadToistyData(pane) {
  // 프로필(메인 사진)
  try {
    const r = await fetch('/api/notion?app=profile');
    const d = await r.json();
    const p = (d.items || [])[0];
    const box = pane.querySelector('#mainPhotoBox');
    const titleEl = pane.querySelector('#toistyTitle');
    if (titleEl) titleEl.textContent = (p && p.name) || '';
    if (p && p.mainImage) {
      const posMap = { Top: 'center top', Center: 'center center', Bottom: 'center bottom' };
      box.innerHTML = `<img src="${p.mainImage}" style="object-position:${posMap[p.imagePosition] || 'center center'}">`;
    } else {
      box.innerHTML = `<div class="no-photo">노션 프로필 DB에 Main Image를 올려주세요</div>`;
    }
  } catch (err) { console.warn('프로필 로드 실패:', err.message); }

  // 오늘의 할 일
  try {
    const r = await fetch('/api/notion?app=todo');
    const d = await r.json();
    const todayStr = new Date().toISOString().slice(0, 10);
    const todays = (d.items || []).filter(t => t.date === todayStr);
    const el = pane.querySelector('#miniTodo');
    if (!todays.length) { el.innerHTML = `<div class="mini-empty">오늘 등록된 항목이 없어요</div>`; }
    else {
      el.innerHTML = todays.slice(0, 6).map(t => `
        <div class="mini-todo-item ${t.completed ? 'done' : ''}">
          <span class="mini-todo-dot ${t.completed ? 'done' : 'undone'}"></span>
          <span>${esc(t.name)}</span>
        </div>`).join('');
    }
  } catch (err) { pane.querySelector('#miniTodo').innerHTML = `<div class="mini-empty">불러오기 실패</div>`; }

  // 북마크 상위 4개
  try {
    const r = await fetch('/api/notion?app=bookmark');
    const d = await r.json();
    const top4 = (d.items || []).sort((a, b) => new Date(b.createdTime || 0) - new Date(a.createdTime || 0)).slice(0, 6);
    const el = pane.querySelector('#miniBookmark');
    if (!top4.length) { el.innerHTML = `<div class="mini-empty">북마크가 없어요</div>`; }
    else {
      el.innerHTML = top4.map(b => `<a class="mini-bm-item" href="${b.url}" target="_blank">→ ${esc(b.name)}</a>`).join('');
    }
  } catch (err) { pane.querySelector('#miniBookmark').innerHTML = `<div class="mini-empty">불러오기 실패</div>`; }
}

/* ════ GALLERY ════ */
async function loadGallery() {
  const grid = document.getElementById('galleryGrid');
  try {
    const r = await fetch('/api/notion?app=gallery');
    const d = await r.json();
    const items = (d.items || []).filter(g => g.photo);
    if (!items.length) { grid.innerHTML = `<div class="mini-empty">아직 사진이 없어요. 노션 갤러리 DB에 글을 추가해보세요</div>`; return; }
    grid.innerHTML = '';
    items.forEach(g => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = `<img src="${g.photo}" loading="lazy">`;
      div.addEventListener('click', () => openGalleryPopup(g));
      grid.appendChild(div);
    });
  } catch (err) { grid.innerHTML = `<div class="mini-empty">불러오기 실패</div>`; }
}
function openGalleryPopup(g) {
  document.getElementById('galleryPopupImg').src = g.photo;
  document.getElementById('galleryPopupCaption').textContent = g.caption || '';
  document.getElementById('galleryPopupOverlay').classList.add('open');
}
document.getElementById('galleryPopupClose').addEventListener('click', () => document.getElementById('galleryPopupOverlay').classList.remove('open'));
document.getElementById('galleryPopupOverlay').addEventListener('click', (e) => { if (e.target.id === 'galleryPopupOverlay') e.currentTarget.classList.remove('open'); });

/* ════ 헤더(메뉴 위) 사진 ════ */
async function loadHeaderPhoto() {
  try {
    const r = await fetch('/api/notion?app=profile');
    const d = await r.json();
    const p = (d.items || [])[0];
    const wrap = document.getElementById('headerPhotoWrap');
    if (p && p.headerImage) wrap.innerHTML = `<img src="${p.headerImage}">`;
  } catch (err) { console.warn('헤더 사진 로드 실패:', err.message); }
}

/* ════ 사이드바 하단 무작위 갤러리 사진 ════ */
let galleryPhotoCache = null;
let galleryPhotoCacheAt = 0;
const GALLERY_CACHE_MS = 5 * 60 * 1000; // 5분 지나면 다시 받아옴 - 노션 사진 링크가 시간이 지나면 만료될 수 있어서

async function loadRandomSidebarPhoto() {
  const box = document.getElementById('sidebarRandomPhoto');
  if (!box) return;
  try {
    const stale = !galleryPhotoCache || (Date.now() - galleryPhotoCacheAt > GALLERY_CACHE_MS);
    if (stale) {
      const r = await fetch('/api/notion?app=gallery');
      const d = await r.json();
      galleryPhotoCache = (d.items || []).filter(g => g.photo);
      galleryPhotoCacheAt = Date.now();
    }
    showRandomSidebarPhoto(0);
  } catch (err) { console.warn('사이드바 사진 로드 실패:', err.message); }
}

function showRandomSidebarPhoto(attempt) {
  const box = document.getElementById('sidebarRandomPhoto');
  if (!box || !galleryPhotoCache || !galleryPhotoCache.length) { if (box) box.innerHTML = ''; return; }
  if (attempt >= galleryPhotoCache.length) { box.innerHTML = ''; return; } // 다 깨져있으면 그냥 비워둠

  const pick = galleryPhotoCache[Math.floor(Math.random() * galleryPhotoCache.length)];
  const img = new Image();
  img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
  img.onerror = () => showRandomSidebarPhoto(attempt + 1); // 깨진 링크면 조용히 다른 사진으로 재시도
  img.src = pick.photo;
}

];
const PALETTE_KEY = 'toisty_palette';

function applyPalette(p) {
  const root = document.documentElement.style;
  root.setProperty('--outer-bg', p.outerBg);
  root.setProperty('--line', p.outerBg);
  root.setProperty('--menu-inactive-bg', p.menuInactiveBg);
  root.setProperty('--menu-active-bg', p.menuActiveBg);
  root.setProperty('--menu-active-text', p.menuActiveText);
  localStorage.setItem(PALETTE_KEY, p.name);
  document.querySelectorAll('.theme-swatch').forEach(sw => sw.classList.toggle('selected', sw.dataset.name === p.name));
}

function renderThemePanel() {
  const panel = document.getElementById('themePanel');
  panel.innerHTML = '';
  const savedName = localStorage.getItem(PALETTE_KEY);
  PALETTES.forEach(p => {
    const sw = document.createElement('div');
    sw.className = 'theme-swatch' + (p.name === savedName ? ' selected' : '');
    sw.dataset.name = p.name;
    sw.title = p.name;
    sw.style.background = p.menuInactiveBg;
    sw.innerHTML = `<div class="sw-active" style="background:${p.menuActiveBg}"></div>`;
    sw.addEventListener('click', () => applyPalette(p));
    panel.appendChild(sw);
  });
}

document.getElementById('themeTrigger').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('themePanel').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.theme-panel') && !e.target.closest('.theme-trigger')) {
    document.getElementById('themePanel').classList.remove('open');
  }
});

(function initPalette() {
  renderThemePanel();
  const savedName = localStorage.getItem(PALETTE_KEY);
  const initial = PALETTES.find(p => p.name === savedName) || PALETTES[0];
  applyPalette(initial);
})();
