<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Notes</title>
<style>
@font-face { font-family:'TAEBAEKfont'; src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2310@1.0/TAEBAEKfont.woff2') format('woff2'); font-weight:normal; font-display:swap; }
@font-face { font-family:'Reperipoint'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/LeferiPoint-WhiteA.woff') format('woff'); font-weight:200; font-display:swap; }
@font-face { font-family:'Reperipoint'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/LeferiPoint-BlackA.woff') format('woff'); font-weight:700; font-display:swap; }
@font-face { font-family:'LeeSunSinDotum'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/YiSunShinDotumM.woff') format('woff'); font-weight:normal; font-display:swap; }

:root{
  --bg:#f4f3ef; --card:#ffffff; --ink:#232220; --ink-soft:#9c988e; --line:#e6e3da; --accent:#5b6b4f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-family:'Reperipoint',sans-serif;font-weight:200}
.wrap{max-width:640px;margin:0 auto;padding:36px 22px 100px}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.logo{font-family:'TAEBAEKfont',sans-serif;font-size:30px;letter-spacing:1px;color:var(--ink)}
.btn-new{border:none;background:var(--ink);color:#fff;padding:11px 20px;font-size:12px;font-weight:700;font-family:'Reperipoint',sans-serif;border-radius:24px;cursor:pointer;letter-spacing:.5px}
.btn-new:active{transform:scale(.97)}

/* ── List ── */
.entry{
  display:flex;align-items:center;gap:16px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;
  cursor:pointer;transition:border-color .15s, box-shadow .15s;
}
.entry:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.entry-date{flex-shrink:0;text-align:center;width:42px}
.entry-date .d{font-family:'Reperipoint',sans-serif;font-weight:700;font-size:19px;line-height:1}
.entry-date .m{font-size:9px;color:var(--ink-soft);margin-top:2px;letter-spacing:.5px}
.entry-body{flex:1;min-width:0}
.entry-title{font-family:'Reperipoint',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{margin-top:5px}
.tag{font-size:10px;color:var(--accent);background:#eef1ea;padding:3px 9px;border-radius:10px;font-weight:700;font-family:'Reperipoint',sans-serif}
.entry-arrow{color:var(--ink-soft);flex-shrink:0;font-size:14px}
.empty{text-align:center;padding:80px 20px;color:var(--ink-soft);font-size:13px;line-height:1.7}
.empty b{display:block;font-family:'TAEBAEKfont',sans-serif;font-size:17px;color:var(--ink);margin-bottom:8px;font-weight:normal}

/* ── Screens ── */
.screen{display:none}
.screen.active{display:block}
.back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.btn-back{background:none;border:none;font-size:13px;color:var(--ink-soft);cursor:pointer;padding:6px 0;font-family:'Reperipoint',sans-serif}
.btn-back:hover{color:var(--ink)}
.action-row{display:flex;gap:8px}
.btn-icon{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;color:var(--ink);font-family:'Reperipoint',sans-serif;font-weight:700}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon.danger:hover{border-color:#b23a2f;color:#b23a2f}

.read-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 30px}
.read-title{font-family:'Reperipoint',sans-serif;font-weight:700;font-size:23px;line-height:1.4;word-break:keep-all}
.read-meta{display:flex;align-items:center;gap:10px;margin:12px 0 26px;font-size:12px;color:var(--ink-soft)}
.read-body{
  font-family:'LeeSunSinDotum',sans-serif;font-size:16px;line-height:32px;
  white-space:pre-wrap;word-break:keep-all;color:var(--ink);
}

/* ── Editor ── */
.editor-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px}
.in-title{
  width:100%;border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-family:'Reperipoint',sans-serif;font-weight:700;font-size:20px;padding:6px 2px 14px;outline:none;margin-bottom:18px;
}
.in-title::placeholder{color:var(--ink-soft);font-weight:200}
.in-category{
  border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:12px;font-family:'Reperipoint',sans-serif;
  font-weight:700;color:var(--accent);outline:none;width:100%;max-width:200px;margin-bottom:22px;background:#eef1ea;
}
.in-category::placeholder{color:var(--accent);opacity:.6}
.in-body{
  width:100%;min-height:340px;border:none;resize:vertical;outline:none;background:transparent;
  font-family:'LeeSunSinDotum',sans-serif;font-size:16px;line-height:32px;color:var(--ink);
}
.in-body::placeholder{color:var(--ink-soft)}
.editor-actions{display:flex;gap:8px;margin-top:22px}
.btn-save{flex:1;padding:14px;border:none;border-radius:24px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;font-family:'Reperipoint',sans-serif;cursor:pointer}
.btn-save:active{transform:scale(.98)}
.btn-cancel{padding:14px 20px;border:1px solid var(--line);border-radius:24px;background:transparent;color:var(--ink-soft);font-size:13px;cursor:pointer;font-family:'Reperipoint',sans-serif}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--ink);color:#fff;border-radius:20px;padding:10px 20px;font-size:12px;z-index:999;transition:transform .3s;font-family:'Reperipoint',sans-serif;max-width:80vw;text-align:center;line-height:1.5}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">NOTES</div>
    <button class="btn-new" id="btnNew">+ NEW</button>
  </header>

  <!-- LIST -->
  <div class="screen active" id="screen-list">
    <div id="list"></div>
  </div>

  <!-- READ -->
  <div class="screen" id="screen-read">
    <div class="back-row">
      <button class="btn-back" id="btnBackFromRead">← 목록으로</button>
      <div class="action-row">
        <button class="btn-icon" id="btnEdit">수정</button>
        <button class="btn-icon danger" id="btnDelete">삭제</button>
      </div>
    </div>
    <div class="read-card">
      <div class="read-title" id="readTitle"></div>
      <div class="read-meta">
        <span id="readDate"></span>
        <span class="tag" id="readCategory" style="display:none"></span>
      </div>
      <div class="read-body" id="readBody"></div>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="screen-edit">
    <div class="back-row">
      <button class="btn-back" id="btnBackFromEdit">← 취소</button>
    </div>
    <div class="editor-card">
      <input class="in-title" id="inTitle" placeholder="제목을 입력하세요">
      <input class="in-category" id="inCategory" list="categoryList" placeholder="# 카테고리">
      <datalist id="categoryList"></datalist>
      <textarea class="in-body" id="inBody" placeholder="오늘은 어떤 이야기를 남길까요..."></textarea>
      <div class="editor-actions">
        <button class="btn-save" id="btnSave">저장</button>
        <button class="btn-cancel" id="btnCancelEdit">취소</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const NOTION_ENDPOINT = '/api/notion?app=writing';
let entries = [];
let editingPageId = null;
let editingCreatedDate = null;
let currentEntry = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),3200); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function localDateStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// 서버가 에러 대신 HTML(로그인 화면 등)을 돌려준 경우를 구분해서 알려줌 - 저장 실패 디버깅용
async function safeJson(res){
  const ct = res.headers.get('content-type') || '';
  if(!ct.includes('application/json')){
    const text = await res.text();
    throw new Error('서버가 JSON이 아닌 응답을 보냈어요: ' + text.slice(0,120));
  }
  return res.json();
}

/* ════ LOAD LIST ════ */
async function loadList(){
  const el = document.getElementById('list');
  el.innerHTML = `<div class="empty">불러오는 중...</div>`;
  try{
    const r = await fetch(NOTION_ENDPOINT);
    const d = await safeJson(r);
    if(!r.ok){ el.innerHTML = `<div class="empty">${esc(d.error||'불러오기 실패')}</div>`; return; }
    entries = (d.items||[]).sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
    renderList();
    renderCategoryOptions();
  }catch(err){
    el.innerHTML = `<div class="empty">불러오기 실패: ${esc(err.message)}</div>`;
  }
}

function renderCategoryOptions(){
  const set = new Set(entries.map(e=>e.category).filter(Boolean));
  const dl = document.getElementById('categoryList');
  dl.innerHTML = [...set].map(c=>`<option value="${esc(c)}">`).join('');
}

function renderList(){
  const el = document.getElementById('list');
  if(!entries.length){
    el.innerHTML = `<div class="empty"><b>아직 쓴 글이 없어요</b>+ NEW 버튼으로 첫 글을 남겨보세요</div>`;
    return;
  }
  el.innerHTML = '';
  entries.forEach(e=>{
    const d = e.date ? new Date(e.date) : null;
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <div class="entry-date">
        <div class="d">${d ? d.getDate() : '-'}</div>
        <div class="m">${d ? (d.getMonth()+1)+'월' : ''}</div>
      </div>
      <div class="entry-body">
        <div class="entry-title">${esc(e.name || '(제목 없음)')}</div>
        <div class="entry-meta">
          <span style="font-size:11px;color:var(--ink-soft)">${fmtDate(e.date)}</span>
          ${e.category ? `<span class="tag" style="margin-left:6px">${esc(e.category)}</span>` : ''}
        </div>
      </div>
      <div class="entry-arrow">→</div>
    `;
    row.addEventListener('click', ()=> openRead(e));
    el.appendChild(row);
  });
}

/* ════ READ ════ */
async function openRead(entry){
  currentEntry = entry;
  document.getElementById('readTitle').textContent = entry.name || '(제목 없음)';
  document.getElementById('readDate').textContent = fmtDate(entry.date);
  const catEl = document.getElementById('readCategory');
  if(entry.category){ catEl.textContent = entry.category; catEl.style.display='inline-block'; }
  else { catEl.style.display='none'; }
  document.getElementById('readBody').textContent = '불러오는 중...';
  showScreen('screen-read');

  try{
    const r = await fetch(`${NOTION_ENDPOINT}&action=content&pageId=${encodeURIComponent(entry.notionPageId)}`);
    const d = await safeJson(r);
    if(!r.ok) throw new Error(d.error);
    const text = (d.content||[]).filter(seg=>seg.type==='text').map(seg=>seg.text||'').join('\n');
    document.getElementById('readBody').textContent = text || '(내용 없음)';
    currentEntry._bodyText = text;
  }catch(err){
    document.getElementById('readBody').textContent = '본문을 불러오지 못했어요: ' + err.message;
  }
}

document.getElementById('btnBackFromRead').onclick = ()=>{ showScreen('screen-list'); };

document.getElementById('btnDelete').onclick = async ()=>{
  if(!currentEntry) return;
  if(!confirm('이 글을 삭제할까요? 노션에서도 함께 보관 처리돼요.')) return;
  try{
    const r = await fetch(NOTION_ENDPOINT, {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pageId: currentEntry.notionPageId })
    });
    if(!r.ok) throw new Error();
    toast('삭제했어요');
    showScreen('screen-list');
    loadList();
  }catch(err){ toast('삭제 실패'); }
};

document.getElementById('btnEdit').onclick = ()=>{
  if(!currentEntry) return;
  openEditor(currentEntry, currentEntry._bodyText || '');
};

/* ════ EDITOR ════ */
document.getElementById('btnNew').onclick = ()=> openEditor(null, '');
document.getElementById('btnBackFromEdit').onclick = ()=> showScreen(editingPageId ? 'screen-read' : 'screen-list');
document.getElementById('btnCancelEdit').onclick = ()=> showScreen(editingPageId ? 'screen-read' : 'screen-list');

function openEditor(entry, bodyText){
  editingPageId = entry ? entry.notionPageId : null;
  editingCreatedDate = entry ? entry.date : null;
  document.getElementById('inTitle').value = entry ? (entry.name||'') : '';
  document.getElementById('inCategory').value = entry ? (entry.category||'') : '';
  document.getElementById('inBody').value = bodyText || '';
  showScreen('screen-edit');
  document.getElementById('inTitle').focus();
}

document.getElementById('btnSave').onclick = async ()=>{
  const name = document.getElementById('inTitle').value.trim();
  const category = document.getElementById('inCategory').value.trim();
  const bodyText = document.getElementById('inBody').value;
  if(!name){ toast('제목을 입력해주세요'); return; }
  if(!bodyText.trim()){ toast('본문을 입력해주세요'); return; }

  const item = {
    appId: editingPageId ? (entries.find(e=>e.notionPageId===editingPageId)?.appId || Date.now().toString()) : Date.now().toString(),
    notionPageId: editingPageId || undefined,
    name, category,
    date: editingCreatedDate || localDateStr(),
    updatedAt: new Date().toISOString(),
    content: bodyText.split('\n').map(line=>({ type:'text', text: line }))
  };

  toast('저장 중...');
  try{
    const r = await fetch(NOTION_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ item })
    });
    const d = await safeJson(r);
    if(!r.ok) throw new Error(d.error || `저장 실패 (status ${r.status})`);
    toast('저장했어요');
    await loadList();
    const saved = entries.find(e=>e.notionPageId===d.notionPageId) ||
      { notionPageId:d.notionPageId, name, category, date:item.date };
    saved._bodyText = bodyText;
    currentEntry = saved;
    document.getElementById('readTitle').textContent = saved.name;
    document.getElementById('readDate').textContent = fmtDate(saved.date);
    const catEl = document.getElementById('readCategory');
    if(saved.category){ catEl.textContent = saved.category; catEl.style.display='inline-block'; } else { catEl.style.display='none'; }
    document.getElementById('readBody').textContent = bodyText;
    showScreen('screen-read');
  }catch(err){
    // 저장이 또 실패하면 이번엔 정확한 이유가 토스트에 그대로 보여요
    toast('저장 실패: ' + err.message);
    console.error('저장 실패 상세:', err);
  }
};

/* ════ INIT ════ */
loadList();
</script>
</body>
</html>
